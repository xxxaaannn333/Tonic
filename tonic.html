          ? 'This viewer blocks the microphone. Open your own copy of the app (see Setup).'
          : 'Microphone permission was denied. Allow it in your browser’s site settings, then tap the mic again.');
      } else if (name === 'NotFoundError' || name === 'OverconstrainedError') {
        setState('error', 'No microphone was found on this device.');
      } else if (name === 'NotReadableError') {
        setState('error', 'The microphone is busy in another app. Close it and try again.');
      } else {
        setState('error', 'Could not start the microphone' + (err && err.message ? ': ' + err.message : '.'));
      }
      return false;
    }
  }

  function stopMic() {
    cancelAnimationFrame(E.raf);
    if (E.stream) E.stream.getTracks().forEach(t => t.stop());
    try { E.source && E.source.disconnect(); } catch (e) { /* noop */ }
    E.stream = null; E.source = null; E.analyser = null;
    if (E.state === 'on' || E.state === 'starting') setState('off');
    Store.set('micWanted', false);
  }

  function setState(s, text = '') {
    E.state = s; E.errorText = text;
    document.dispatchEvent(new CustomEvent('micstate', { detail: { state: s, text } }));
  }

  function loop() {
    E.raf = requestAnimationFrame(loop);
    if (!E.analyser || !E.ctx) return;
    E.frameNo++;
    const ctx = E.ctx, buf = E.buf, n = buf.length;
    E.analyser.getFloatTimeDomainData(buf);
    const t = ctx.currentTime;
    const muted = t < E.mutedUntil;
    const rms = rmsOf(buf, n - 1024, n);
    const hf = hfRms(buf, n - 768, n);
    if (!muted) {
      if (rms < E.noise) E.noise = E.noise * 0.9 + rms * 0.1; else E.noise = Math.min(0.05, E.noise * 1.0008);
      if (hf < E.noiseHF) E.noiseHF = E.noiseHF * 0.9 + hf * 0.1; else E.noiseHF = Math.min(0.08, E.noiseHF * 1.0008);
    }
    const gate = Math.max(0.0018, E.noise * 2.8);
    const gateHF = Math.max(0.003, E.noiseHF * 3);
    const active = !muted && rms > gate;
    const onset = !muted && E.od.process(hf, t, gateHF, buf, E.sr || ctx.sampleRate);
    let pitch = null, stable = null;
    if (active) {
      const p = E.pd.detect(buf);
      if (p && p.clarity > 0.82) pitch = p;
    }
    const h = E.pitchHist;
    h.push(pitch ? pitch.midi : null);
    if (h.length > 5) h.shift();
    const recent = h.slice(-3);
    if (recent.length === 3 && recent.every(v => v !== null)) {
      const mx = Math.max(...recent), mn = Math.min(...recent);
      if (mx - mn < 0.4) stable = recent.slice().sort((a, b) => a - b)[1];
    }
    let chroma = null;
    if (E.chordWanted > 0 && active && (E.frameNo % 2 === 0)) {
      chroma = E.ca.compute(buf);
      E.chromaReady = true;
      E.lastChromaT = t;
    } else if (!active) {
      E.chromaReady = false;
    }
    const level = Math.max(0, Math.min(1, (20 * Math.log10(rms + 1e-9) + 62) / 52));
    E.frame = { t, rms, gate, level, active, onset, muted, pitch, stable, chroma };
    E.listeners.forEach(fn => { try { fn(E.frame); } catch (e) { console.error(e); } });
  }

  function on(fn) { E.listeners.add(fn); return () => E.listeners.delete(fn); }
  function now() { return E.ctx ? E.ctx.currentTime : 0; }
  function setSensitivity(v) { E.sensitivity = v; if (E.inGain) E.inGain.gain.value = v; }
  function needChords(on) { E.chordWanted = Math.max(0, E.chordWanted + (on ? 1 : -1)); }
  function verifyChord(name, voicing, strict = 1, anyVoicing = false) {
    if (!E.chromaReady || !E.ca) return { ok: false, score: 0 };
    return E.matcher.verify(E.ca, E.ca.chroma, name, voicing, strict, anyVoicing);
  }
  function bestChord() {
    if (!E.chromaReady || !E.ca) return null;
    const r = E.matcher.analyze(E.ca.chroma);
    return r.best ? { name: r.best.name, score: r.score } : null;
  }
  /** Strength (0..1, relative to the loudest peak) of a single note inside the current spectrum. */
  function noteLevel(midi) {
    if (!E.chromaReady || !E.ca) return 0;
    return E.ca.peakNear(midiToFreq(midi), 40);
  }
  function mute(untilTime) { E.mutedUntil = Math.max(E.mutedUntil, untilTime); }

  /** Measure round-trip latency by playing in-band clicks and listening for them. */
  async function measureLatency(onProgress) {
    if (E.state !== 'on') return null;
    const ctx = E.ctx;
    const t0 = ctx.currentTime + 0.6, gap = 0.55, count = 8;
    const times = [];
    for (let i = 0; i < count; i++) {
      const t = t0 + i * gap;
      times.push(t);
      const o = ctx.createOscillator(), g = ctx.createGain();
      o.frequency.value = 880; o.type = 'square';
      g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(0.5, t + 0.002); g.gain.exponentialRampToValueAtTime(0.001, t + 0.05);
      o.connect(g); g.connect(E.master); o.start(t); o.stop(t + 0.06);
    }
    const onsets = [];
    const off = on(f => { if (f.onset) onsets.push(f.t); });
    await new Promise(r => setTimeout(r, (0.6 + count * gap + 0.5) * 1000));
    off();
    const delays = [];
    for (const t of times) {
      const o = onsets.find(x => x > t - 0.005 && x < t + 0.4);
      if (o !== undefined) delays.push(o - t);
    }
    if (onProgress) onProgress(delays.length, count);
    if (delays.length < 5) return null;
    delays.sort((a, b) => a - b);
    const med = delays[Math.floor(delays.length / 2)];
    const spread = delays[delays.length - 2] - delays[1];
    if (spread > 0.06) return null;
    return med;
  }

  /** Tap-along fallback (headphones): user strums with 8 clicks. */
  async function measureTapLatency(bpm = 80) {
    if (E.state !== 'on') return null;
    const beat = 60 / bpm, t0 = E.ctx.currentTime + 1.0, count = 10, times = [];
    for (let i = 0; i < count; i++) { const t = t0 + i * beat; times.push(t); Synth.tick(t, i % 4 === 0); }
    const onsets = [];
    const off = on(f => { if (f.onset) onsets.push(f.t); });
    await new Promise(r => setTimeout(r, (1.0 + count * beat + 0.6) * 1000));
    off();
    const d = [];
    times.slice(2).forEach(t => { const o = onsets.find(x => Math.abs(x - t - 0.08) < 0.25); if (o !== undefined) d.push(o - t); });
    if (d.length < 5) return null;
    d.sort((a, b) => a - b);
    return d[Math.floor(d.length / 2)];
  }

  return {
    E, ensure, startMic, stopMic, on, now, setSensitivity, needChords, verifyChord, bestChord, noteLevel, mute,
    measureLatency, measureTapLatency, micBlockedByFrame,
    get state() { return E.state; }, get errorText() { return E.errorText; },
    get latency() { return E.latency; }, set latency(v) { E.latency = v; },
  };
})();

/* ---------------- Synth ---------------- */
const Synth = (() => {
  const cache = new Map();
  const active = new Set();
  let headphones = false;
  function ctx() { return Engine.ensure(); }
  function out() { return Engine.E.master; }
  function buffer(kind, midi) {
    const key = kind + midi;
    if (cache.has(key)) return cache.get(key);
    const c = ctx();
    const sr = c.sampleRate;
    const f = midiToFreq(midi);
    let data;
    if (kind === 'piano') data = pianoTone(f, sr, 3.2, { amp: 0.32 });
    else if (kind === 'uke') data = karplusStrong(f, sr, 2.2, { amp: 0.42, t60: 1.8 });
    else data = karplusStrong(f, sr, 3.5, { amp: 0.4 });
    const b = c.createBuffer(1, data.length, sr);
    b.copyToChannel ? b.copyToChannel(data, 0) : b.getChannelData(0).set(data);
    cache.set(key, b);
    return b;
  }
  function track(node, endTime) {
    active.add(node);
    node.onended = () => active.delete(node);
  }
  function play(kind, midi, when, { gain = 0.8, dur = null } = {}) {
    const c = ctx(); if (!c) return;
    const src = c.createBufferSource();
    src.buffer = buffer(kind, midi);
    const g = c.createGain();
    g.gain.value = gain;
    src.connect(g); g.connect(out());
    const t = Math.max(when || 0, c.currentTime);
    src.start(t);
    if (dur) {
      g.gain.setValueAtTime(gain, t + dur);
      g.gain.exponentialRampToValueAtTime(0.0008, t + dur + 0.25);
      src.stop(t + dur + 0.3);
    }
    track(src);
    return t + (dur ? dur + 0.3 : src.buffer.duration);
  }
  /** Strum a chord (array of midis, low to high). */
  function strum(kind, midis, when, { down = true, spread = 0.014, gain = 0.6, dur = null } = {}) {
    const order = down ? midis : midis.slice().reverse();
    let end = 0;
    order.forEach((m, i) => { end = Math.max(end, play(kind, m, when + i * spread, { gain: gain * (0.85 + Math.random() * 0.25), dur })); });
    return end;
  }
  function voice(midi, when, dur, gain = 0.25) {
    const c = ctx(); if (!c) return;
    const t = Math.max(when, c.currentTime);
    const o = c.createOscillator();
    const real = new Float32Array([0, 1, 0.45, 0.25, 0.12, 0.06]);
    o.setPeriodicWave(c.createPeriodicWave(real, new Float32Array(real.length)));
    o.frequency.value = midiToFreq(midi);
    const lfo = c.createOscillator(), lg = c.createGain();
    lfo.frequency.value = 5.2; lg.gain.value = 14;
    lfo.connect(lg); lg.connect(o.detune);
    const g = c.createGain();
    g.gain.setValueAtTime(0, t);
    g.gain.linearRampToValueAtTime(gain, t + 0.06);
    g.gain.setValueAtTime(gain, t + Math.max(0.07, dur - 0.08));
    g.gain.linearRampToValueAtTime(0, t + dur);
    const f = c.createBiquadFilter(); f.type = 'lowpass'; f.frequency.value = 2200;
    o.connect(f); f.connect(g); g.connect(out());
    o.start(t); lfo.start(t); o.stop(t + dur + 0.05); lfo.stop(t + dur + 0.05);
    track(o);
    return t + dur;
  }
  /** Metronome tick: high-pitched so the mic analysis (low-passed at 2.4 kHz) ignores it. */
  function tick(when, accent = false, gain = 0.5) {
    const c = ctx(); if (!c) return;
    const t = Math.max(when, c.currentTime);
    const len = Math.floor(c.sampleRate * 0.03);
    const key = 'tick' + (accent ? 1 : 0);
    let b = cache.get(key);
    if (!b) {
      b = c.createBuffer(1, len, c.sampleRate);
      const d = b.getChannelData(0);
      const f1 = accent ? 5200 : 4300;
      for (let i = 0; i < len; i++) {
        const env = Math.exp(-i / (c.sampleRate * 0.006));
        d[i] = env * (Math.sin(2 * Math.PI * f1 * i / c.sampleRate) * 0.8 + Math.sin(2 * Math.PI * f1 * 1.5 * i / c.sampleRate) * 0.3);
      }
      cache.set(key, b);
    }
    const s = c.createBufferSource(); s.buffer = b;
    const hp = c.createBiquadFilter(); hp.type = 'highpass'; hp.frequency.value = 3200;
    const g = c.createGain(); g.gain.value = accent ? gain * 1.2 : gain;
    s.connect(hp); hp.connect(g); g.connect(out());
    s.start(t);
    track(s);
  }
  function stopAll() {
    active.forEach(n => { try { n.stop(); } catch (e) { /* already stopped */ } });
    active.clear();
    // nothing is playing any more, so listen again right away (short tail for room echo)
    Engine.E.mutedUntil = Math.min(Engine.E.mutedUntil, Engine.now() + 0.12);
  }
  /** Play a note/chord for the user to hear, muting mic analysis meanwhile. */
  function preview(kind, midis, { arpeggio = false, dur = 1.6 } = {}) {
    const c = ctx(); if (!c) return 0;
    const t = c.currentTime + 0.03;
    let end;
    if (kind === 'voice') {
      end = t;
      midis.forEach((m, i) => { end = voice(m, t + i * dur, dur * 0.95); });
    } else if (arpeggio) {
      end = t;
      midis.forEach((m, i) => { end = Math.max(end, play(kind, m, t + i * 0.32, { gain: 0.7, dur: dur + (midis.length - i) * 0.32 })); });
    } else if (midis.length > 1 && kind !== 'piano') {
      end = strum(kind, midis, t, { gain: 0.6, dur });
    } else {
      end = t;
      midis.forEach(m => { end = Math.max(end, play(kind, m, t, { gain: midis.length > 1 ? 0.45 : 0.7, dur })); });
    }
    Engine.mute(end + 0.25);
    return end;
  }
  return { play, strum, voice, tick, stopAll, preview, buffer, get headphones() { return headphones; }, set headphones(v) { headphones = v; } };
})();

/* ---------------- Look-ahead scheduler ---------------- */
class Scheduler {
  constructor() { this.timer = 0; this.events = []; this.idx = 0; this.running = false; }
  /** events: [{time (ctx seconds), fn(time)}] sorted */
  start(events) {
    this.stop();
    this.events = events.slice().sort((a, b) => a.time - b.time);
    this.idx = 0; this.running = true;
    const pump = () => {
      if (!this.running) return;
      const horizon = Engine.now() + 0.15;
      while (this.idx < this.events.length && this.events[this.idx].time <= horizon) {
        const ev = this.events[this.idx++];
        try { ev.fn(ev.time); } catch (e) { console.error(e); }
      }
      if (this.idx < this.events.length) this.timer = setTimeout(pump, 30);
    };
    pump();
  }
  add(ev) { this.events.push(ev); this.events.sort((a, b) => a.time - b.time); }
  stop() { this.running = false; clearTimeout(this.timer); }
}

/* ---- diagrams.js ---- */
/* ==========================================================================
   Diagrams (SVG strings): chord boxes, piano keys, fretboard, staff.
   ========================================================================== */

function chordDiagram(instId, name, opts = {}) {
  const sh = opts.shape || shapeFor(instId, name);
  const n = instId === 'ukulele' ? 4 : 6;
  const W = 120, mx = n === 4 ? 26 : 16, top = opts.showName === false ? 22 : 40, fs = 22, nf = n === 4 ? 4 : 5;
  const sx = (W - 2 * mx) / (n - 1);
  const H = top + nf * fs + 18;
  const accent = opts.color || 'var(--accent)';
  if (!sh) return `<svg viewBox="0 0 ${W} ${H}" class="chord-svg"><text x="${W / 2}" y="${H / 2}" text-anchor="middle" class="cd-name">${esc(chordLabel(name))}</text><text x="${W / 2}" y="${H / 2 + 18}" text-anchor="middle" class="cd-fr">no shape</text></svg>`;
  let frets = sh.frets.slice(), fingers = (sh.fingers || []).slice();
  const lefty = opts.leftHanded ?? Settings.get('leftHanded');
  if (lefty) { frets.reverse(); fingers.reverse(); }
  const fretted = frets.filter(f => f > 0);
  const maxF = fretted.length ? Math.max(...fretted) : 0;
  const minF = fretted.length ? Math.min(...fretted) : 0;
  const base = maxF <= nf ? 1 : minF;
  const X = i => mx + i * sx;
  let s = `<svg viewBox="0 0 ${W} ${H}" class="chord-svg" role="img" aria-label="${esc(chordLabel(name))} chord diagram">`;
  if (opts.showName !== false) s += `<text x="${W / 2}" y="20" text-anchor="middle" class="cd-name">${esc(chordLabel(name))}</text>`;
  // nut / frets
  for (let f = 0; f <= nf; f++) {
    const y = top + f * fs;
    if (f === 0 && base === 1 && opts.capo) s += `<rect x="${X(0) - 7}" y="${y - 4.5}" width="${X(n - 1) - X(0) + 14}" height="9" rx="4.5" class="cd-capo"/>`;
    else s += `<line x1="${X(0)}" y1="${y}" x2="${X(n - 1)}" y2="${y}" class="${f === 0 && base === 1 ? 'cd-nut' : 'cd-fret'}"/>`;
  }
  if (opts.capo && opts.showName !== false) s += `<text x="${W - 2}" y="12" text-anchor="end" class="cd-capo-t">capo ${opts.capo}</text>`;
  for (let i = 0; i < n; i++) s += `<line x1="${X(i)}" y1="${top}" x2="${X(i)}" y2="${top + nf * fs}" class="cd-string"/>`;
  if (base > 1) s += `<text x="${X(n - 1) + 6}" y="${top + fs * 0.65}" class="cd-fr">${base}fr</text>`;
  // barre (finger 1 on several strings at the lowest fret)
  const barreIdx = frets.map((f, i) => (fingers[i] === 1 && f === minF && f > 0) ? i : -1).filter(i => i >= 0);
  if (barreIdx.length >= 2) {
    const a = Math.min(...barreIdx), b = Math.max(...barreIdx);
    const y = top + (minF - base + 0.5) * fs;
    s += `<rect x="${X(a) - 8}" y="${y - 8}" width="${X(b) - X(a) + 16}" height="16" rx="8" fill="${accent}"/>`;
  }
  frets.forEach((f, i) => {
    const x = X(i);
    if (f < 0) s += `<text x="${x}" y="${top - 7}" text-anchor="middle" class="cd-x">×</text>`;
    else if (f === 0) s += `<circle cx="${x}" cy="${top - 11}" r="5" class="cd-open"/>`;
    else {
      const y = top + (f - base + 0.5) * fs;
      s += `<circle cx="${x}" cy="${y}" r="8.5" fill="${accent}"/>`;
      if (fingers[i]) s += `<text x="${x}" y="${y + 4}" text-anchor="middle" class="cd-finger">${fingers[i]}</text>`;
    }
  });
  // string names
  const names = INSTRUMENTS[instId].strings.slice();
  if (lefty) names.reverse();
  names.forEach((nm, i) => { s += `<text x="${X(i)}" y="${H - 3}" text-anchor="middle" class="cd-sname">${nm}</text>`; });
  return s + '</svg>';
}

/** Piano keyboard. marks: {midi: {color, label}} */
function keyboardSVG(lo, hi, marks = {}, opts = {}) {
  // expand to whole white keys
  const isBlack = m => [1, 3, 6, 8, 10].includes(mod12(m));
  while (isBlack(lo)) lo--;
  while (isBlack(hi)) hi++;
  const whites = [];
  for (let m = lo; m <= hi; m++) if (!isBlack(m)) whites.push(m);
  const ww = 24, wh = opts.height || 96, bw = 15, bh = wh * 0.62;
  const W = whites.length * ww;
  let s = `<svg viewBox="0 0 ${W + 2} ${wh + 2}" class="kb-svg" preserveAspectRatio="xMidYMid meet" role="img" aria-label="piano keys">`;
  const xOf = {};
  whites.forEach((m, i) => {
    xOf[m] = i * ww;
    const mk = marks[m];
    s += `<rect x="${i * ww + 1}" y="1" width="${ww - 1}" height="${wh}" rx="3" class="kb-white" ${mk ? `style="fill:${mk.color || 'var(--accent)'}"` : ''}/>`;
    if (mk && mk.label) s += `<text x="${i * ww + ww / 2 + 0.5}" y="${wh - 8}" text-anchor="middle" class="kb-label">${esc(mk.label)}</text>`;
    else if (mod12(m) === 0 && opts.labelC !== false) s += `<text x="${i * ww + ww / 2 + 0.5}" y="${wh - 8}" text-anchor="middle" class="kb-c">C${Math.floor(m / 12) - 1}</text>`;
  });
  for (let m = lo; m <= hi; m++) {
    if (!isBlack(m)) continue;
    const x = xOf[m - 1] + ww - bw / 2;
    const mk = marks[m];
    s += `<rect x="${x + 0.5}" y="1" width="${bw}" height="${bh}" rx="2.5" class="kb-black" ${mk ? `style="fill:${mk.color || 'var(--accent)'}"` : ''}/>`;
    if (mk && mk.label) s += `<text x="${x + bw / 2 + 0.5}" y="${bh - 6}" text-anchor="middle" class="kb-label kb-label-b">${esc(mk.label)}</text>`;
  }
  return s + '</svg>';
}

/** Horizontal fretboard. marks: [{s (0=lowest string), f, label, color, root}] */
function fretboardSVG(instId, marks = [], opts = {}) {
  const inst = INSTRUMENTS[instId];
  const n = inst.tuning.length;
  const from = opts.from ?? 0, to = opts.to ?? Math.max(5, ...marks.map(m => m.f + 1));
  const fw = 46, sh = 22, left = 26, topPad = 12;
  const W = left + (to - from + 1) * fw + 10, H = topPad + (n - 1) * sh + 26;
  const lefty = opts.leftHanded ?? Settings.get('leftHanded');
  const yOf = s => topPad + (n - 1 - s) * sh;  // highest string on top
  const xOf = f => left + (f - from) * fw + fw / 2;
  let s = `<svg viewBox="0 0 ${W} ${H}" class="fb-svg" role="img" aria-label="fretboard" ${lefty ? 'style="transform:scaleX(-1)"' : ''}>`;
  for (let f = from; f <= to; f++) {
    const x = left + (f - from) * fw;
    if ([3, 5, 7, 9, 15, 17].includes(f)) s += `<circle cx="${x + fw / 2}" cy="${topPad + (n - 1) * sh / 2}" r="4" class="fb-inlay"/>`;
    if (f === 12) { s += `<circle cx="${x + fw / 2}" cy="${topPad + sh * 0.5}" r="4" class="fb-inlay"/><circle cx="${x + fw / 2}" cy="${topPad + (n - 1.5) * sh}" r="4" class="fb-inlay"/>`; }
    s += `<line x1="${x + fw}" y1="${topPad}" x2="${x + fw}" y2="${topPad + (n - 1) * sh}" class="${f === 0 ? 'fb-nut' : 'fb-fret'}"/>`;
    if (f > 0) s += `<text x="${x + fw / 2}" y="${H - 4}" text-anchor="middle" class="fb-num" ${lefty ? `transform="scale(-1,1) translate(${-2 * (x + fw / 2)},0)"` : ''}>${f}</text>`;
  }
  if (opts.capo && opts.capo >= from && opts.capo <= to) {
    const cx = xOf(opts.capo) + fw * 0.12;
    s += `<rect x="${cx - 6}" y="${topPad - 7}" width="12" height="${(n - 1) * sh + 14}" rx="6" class="fb-capo"/>`;
  }
  for (let i = 0; i < n; i++) {
    s += `<line x1="${left}" y1="${yOf(i)}" x2="${W - 10}" y2="${yOf(i)}" class="fb-string" style="stroke-width:${1 + (n - i) * 0.25}"/>`;
    s += `<text x="10" y="${yOf(i) + 4}" text-anchor="middle" class="fb-sname" ${lefty ? `transform="scale(-1,1) translate(-20,0)"` : ''}>${inst.strings[i]}</text>`;
  }
  for (const m of marks) {
    if (m.f < from || m.f > to) continue;
    const x = xOf(m.f), y = yOf(m.s);
    s += `<circle cx="${x}" cy="${y}" r="9.5" fill="${m.color || (m.root ? 'var(--accent)' : 'var(--accent-soft)')}" ${m.root ? '' : 'stroke="var(--accent)" stroke-width="1.5"'}/>`;
    if (m.label) s += `<text x="${x}" y="${y + 3.5}" text-anchor="middle" class="fb-label" ${lefty ? `transform="scale(-1,1) translate(${-2 * x},0)"` : ''}>${esc(m.label)}</text>`;
  }
  return s + '</svg>';
}

/** Treble staff with note heads (for reading lessons). */
function staffSVG(midis, opts = {}) {
  const W = Math.max(160, 70 + midis.length * 44), H = 120, top = 30, ls = 10;
  const STEP = { 0: 0, 1: 0, 2: 1, 3: 1, 4: 2, 5: 3, 6: 3, 7: 4, 8: 4, 9: 5, 10: 5, 11: 6 };
  const pos = m => (Math.floor(m / 12) - 1) * 7 + STEP[mod12(m)];   // diatonic step
  const e4 = pos(64);                                                   // bottom line
  let s = `<svg viewBox="0 0 ${W} ${H}" class="staff-svg" role="img" aria-label="music staff">`;
  for (let i = 0; i < 5; i++) s += `<line x1="8" y1="${top + i * ls}" x2="${W - 8}" y2="${top + i * ls}" class="st-line"/>`;
  s += `<text x="12" y="${top + 4 * ls + 9}" class="st-clef">𝄞</text>`;
  midis.forEach((m, i) => {
    const x = 70 + i * 44;
    const p = pos(m) - e4;                 // 0 = E4 line, 1 = F4 space ...
    const y = top + 4 * ls - p * ls / 2;
    for (let l = -2; l >= p; l -= 2) s += `<line x1="${x - 12}" y1="${top + 4 * ls - l * ls / 2}" x2="${x + 12}" y2="${top + 4 * ls - l * ls / 2}" class="st-line"/>`;
    for (let l = 10; l <= p; l += 2) s += `<line x1="${x - 12}" y1="${top + 4 * ls - l * ls / 2}" x2="${x + 12}" y2="${top + 4 * ls - l * ls / 2}" class="st-line"/>`;
    if ([1, 3, 6, 8, 10].includes(mod12(m))) s += `<text x="${x - 20}" y="${y + 4}" class="st-acc">♯</text>`;
    s += `<ellipse cx="${x}" cy="${y}" rx="6.5" ry="4.8" transform="rotate(-20 ${x} ${y})" class="st-head ${opts.hl === i ? 'hl' : ''}"/>`;
    if (opts.labels) s += `<text x="${x}" y="${H - 6}" text-anchor="middle" class="st-lbl">${esc(noteLabel(m, false))}</text>`;
  });
  return s + '</svg>';
}

/** Small TAB line for a short phrase of positioned notes. */
function tabSVG(instId, notes, opts = {}) {
  const inst = INSTRUMENTS[instId];
  const n = inst.tuning.length, ls = 14, top = 12;
  const W = Math.max(150, 40 + notes.length * 34), H = top + (n - 1) * ls + 14;
  let s = `<svg viewBox="0 0 ${W} ${H}" class="tab-svg" role="img" aria-label="tablature">`;
  for (let i = 0; i < n; i++) {
    const y = top + (n - 1 - i) * ls;
    s += `<line x1="22" y1="${y}" x2="${W - 6}" y2="${y}" class="tb-line"/><text x="10" y="${y + 4}" text-anchor="middle" class="tb-s">${inst.strings[i]}</text>`;
  }
  notes.forEach((nt, i) => {
    if (nt.s === undefined) return;
    const x = 40 + i * 34, y = top + (n - 1 - nt.s) * ls;
    s += `<rect x="${x - 8}" y="${y - 7}" width="16" height="14" rx="3" class="tb-bg ${opts.hl === i ? 'hl' : ''}"/><text x="${x}" y="${y + 4.5}" text-anchor="middle" class="tb-f">${nt.f}</text>`;
  });
  return s + '</svg>';
}

/* ---- strum.js ---- */
/* ==========================================================================
   Strumming notation, strum diagrams and finger-picking pattern generator.
   --------------------------------------------------------------------------
   Strum notation: one token per grid cell, one bar long, separated by spaces.
     D  down-strum      U  up-strum       -  ghost (hand moves, no sound)
     x  muted "chuck"   B  bass note only (thumb / pick on the bass string)
   The grid is worked out from the number of cells: 4 or 8 in 4/4 = quarters
   or eighths, 16 = sixteenths, 12 = triplets, 3 or 6 in 3/4 and so on.
   ========================================================================== */

const STRUM_NAMES = {
  quarter: 'D D D D', half: 'D - D -', whole: 'D - - -', eighth: 'D U D U D U D U',
  folk: 'D - D U - U D U', island: 'D - D U - U D U', waltz: 'D D D',
  triplet: 'D U D D U D D U D D U D', swing: 'D - U D - U D - U D - U',
};

/** -> { offs:[beat offsets of sounded strokes], dirs:[symbol per stroke], cells:[{off,sym}], cell } */
function parseStrum(pat, sig = 4) {
  if (Array.isArray(pat)) {
    const dirs = pat.map(o => { const fr = o % 1; return fr > 0.2 && fr < 0.8 ? 'U' : 'D'; });
    return { offs: pat.slice(), dirs, cells: pat.map((o, i) => ({ off: o, sym: dirs[i], cw: 0.5 })), cell: 0.5, len: sig };
  }
  let str = STRUM_NAMES[pat] || pat || STRUM_NAMES.quarter;
  if (pat === 'waltz' && sig !== 3) str = 'D D D D';
  if (pat === 'quarter') str = Array(sig).fill('D').join(' ');
  if (pat === 'eighth') str = Array(sig).fill('D U').join(' ');
  const bars = str.split('|').map(b => b.trim()).filter(Boolean);
  let cells = [], cell = sig;
  bars.forEach((bar, bi) => {
    const toks = bar.split(/\s+/);
    const cw = sig / toks.length;
    cell = Math.min(cell, cw);
    toks.forEach((t, i) => cells.push({ off: bi * sig + i * cw, sym: t === '.' ? '-' : t, cw }));
  });
  const played = cells.filter(c => c.sym !== '-');
  return { offs: played.map(c => c.off), dirs: played.map(c => c.sym), cells, cell, len: bars.length * sig };
}

/** Count word for a beat offset inside the bar: 1 e & a 2 … / 1 & a for triplets. */
function countLabel(off, cell) {
  const beat = Math.floor(off + 1e-6), fr = off - beat;
  if (fr < 0.02) return String(beat + 1);
  const trip = Math.abs(cell * 3 - Math.round(cell * 3)) < 0.01 && Math.abs(cell * 2 - Math.round(cell * 2)) > 0.01;
  if (trip) return fr < 0.5 ? '&' : 'a';
  if (Math.abs(fr - 0.5) < 0.02) return '&';
  return fr < 0.5 ? 'e' : 'a';
}

const STRUM_GLYPH = { D: '↓', U: '↑', x: '✕', B: 'B', '-': '↓' };

/** HTML strum diagram for lesson pages. Tap to hear it. */
function strumDiagram(pat, { sig = 4, inst = 'guitar', chord = null, bpm = 80, caption = '' } = {}) {
  const P = parseStrum(pat, sig);
  const row = h('div', { class: 'strum-row' });
  P.cells.forEach((c, i) => {
    const ghost = c.sym === '-';
    const up = c.sym === 'U' || (ghost && isUpCell(c.off, c.cw));
    const onBeat = c.off % 1 < 0.02;
    if (i > 0 && c.off % sig < 0.02) row.append(h('div', { class: 'strum-bar' }));
    row.append(h('div', { class: 'strum-cell' + (ghost ? ' ghost' : '') + (onBeat ? ' beat' : '') + (c.sym === 'x' ? ' mute' : '') + (c.sym === 'B' ? ' bass' : '') },
      h('span', { class: 'sc-arrow' }, ghost ? (up ? '↑' : '↓') : STRUM_GLYPH[c.sym] || c.sym),
      h('span', { class: 'sc-count' }, countLabel(c.off % sig, c.cw))));
  });
  const name = chord || (inst === 'ukulele' ? 'C' : 'Em');
  const play = () => {
    const kind = INSTRUMENTS[inst] ? INSTRUMENTS[inst].synth : 'guitar';
    const v = chordVoicing(inst === 'voice' ? 'piano' : inst, name) || [52, 59, 64];
    const spb = 60 / bpm, t0 = Engine.ensure().currentTime + 0.1;
    let end = t0;
    const reps = P.len > sig ? 1 : 2;
    for (let bar = 0; bar < reps; bar++) P.cells.forEach(c => {
      if (c.sym === '-') return;
      const t = t0 + (bar * P.len + c.off) * spb;
      end = Math.max(end, playStroke(kind, v, c.sym, t, spb * c.cw * 1.6));
    });
    for (let b = 0; b < P.len * reps; b++) Synth.tick(t0 + b * spb, b % sig === 0, 0.25);
    Engine.mute(end + 0.3);
  };
  return h('button', { class: 'strum-fig', onclick: play, title: 'Tap to hear' }, row,
    h('span', { class: 'strum-cap' }, icon('volume', 14), caption || 'Tap to hear · faint arrows = move your hand without touching the strings'));
}
function isUpCell(off, cell) {
  // the hand travels down on the "strong" half of each pair of cells and up on the weak half
  const k = Math.round(off / cell);
  const trip = Math.abs(cell * 3 - Math.round(cell * 3)) < 0.01 && Math.abs(cell * 2 - Math.round(cell * 2)) > 0.01;
  return trip ? false : k % 2 === 1;
}
/** Play one stroke of a strum pattern through the synth. Returns its end time. */
function playStroke(kind, voicing, sym, t, dur) {
  if (sym === 'x') return Synth.strum(kind, voicing, t, { down: true, gain: 0.3, dur: 0.035, spread: 0.004 });
  if (sym === 'B') return Synth.play(kind, voicing[0], t, { gain: 0.7, dur: Math.max(0.3, dur) });
  if (sym === 'U') return Synth.strum(kind, voicing.slice(-Math.min(4, voicing.length)), t, { down: false, gain: 0.42, dur: Math.max(0.25, dur) });
  return Synth.strum(kind, voicing, t, { down: true, gain: 0.55, dur: Math.max(0.25, dur) });
}

/* ---------------- Finger-picking patterns ----------------
   pick: 'T 3 2 3 1 3 2 3'  (one token per grid cell, default eighth notes)
     T  thumb on the chord's root bass string      B  alternate bass string
     1-6  string number (1 = thinnest)             -  let ring
     a+b  pinch: two strings together (e.g. T+1)
   On the piano the numbers count chord notes from the bottom (1 = lowest),
   T is the bass note one octave below and 8 is the root an octave above. */
function pickTargets(inst, name, shapeOverride) {
  if (INSTRUMENTS[inst].kind !== 'fretted') {
    const v = pianoVoicing(name);
    const c = parseChord(String(name).split('/')[0]);
    const slash = String(name).includes('/') ? parsePc(String(name).split('/')[1]) : null;
    const bassPc = slash !== null ? slash : c ? c.root : mod12(v[0]);
    let bass = 36 + bassPc; if (bass < 41) bass += 12;
    return { piano: true, v, bass };
  }
  const sh = shapeOverride || shapeFor(inst, name);
  if (!sh) return null;
  const tun = INSTRUMENTS[inst].tuning, n = tun.length;
  const c = parseChord(String(name).split('/')[0]);
  const slash = String(name).includes('/') ? parsePc(String(name).split('/')[1]) : null;
  const rootPc = slash !== null ? slash : c ? c.root : null;
  const played = sh.frets.map((f, i) => f >= 0 ? i : -1).filter(i => i >= 0);
  let rootIdx = played[0];
  if (inst === 'guitar') { const r = played.find(i => i <= 2 && mod12(tun[i] + sh.frets[i]) === rootPc); if (r !== undefined) rootIdx = r; }
  else rootIdx = played.includes(1) ? 1 : played[0];           // ukulele: thumb rests on the C string
  let altIdx = inst === 'guitar' ? (rootIdx >= 2 ? 3 : 2) : 0;   // ukulele alternate = G string
  if (!played.includes(altIdx)) altIdx = played.find(i => i !== rootIdx) ?? rootIdx;
  return { sh, tun, n, played, rootIdx, altIdx };
}
function pickFinger(inst, sIdx, n, isThumb) {
  if (isThumb) return 'p';
  const strNo = n - sIdx;                // 1 = thinnest
  if (inst === 'guitar') return strNo >= 4 ? 'p' : strNo === 3 ? 'i' : strNo === 2 ? 'm' : 'a';
  return strNo === 4 ? 'p' : strNo === 3 ? 'i' : strNo === 2 ? 'm' : 'a';
}
/** Build picked-note events for a chord chart. */
function pickEvents(inst, s) {
  const sig = s.sig || 4, grid = s.pickGrid || 0.5;
  const out = [];
  let ci = 0;
  const capo = s.capo || 0, fl = s.flats ?? Settings.get('flats');
  for (const c0 of timeline(parseChords(s.chords, sig))) {
    const c = c0.name && s.transpose ? Object.assign({}, c0, { name: transposeChord(c0.name, s.transpose, fl) }) : c0;
    const toks = String(Array.isArray(s.pick) ? s.pick[ci % s.pick.length] : s.pick).trim().split(/\s+/);
    if (c.name) ci++;
    if (!c.name) { out.push({ kind: 'rest', beat: c.beat, beats: c.beats }); continue; }
    const shp = s.shapes && s.shapes[c.name] ? shapeFromString(s.shapes[c.name][0], s.shapes[c.name][1]) : null;
    const T = pickTargets(inst, c.name, shp);
    if (!T) continue;
    if (T.piano) { T.shift = s.pickOct || 0; if (T.shift) T.bass -= 12; }
    out.push({ kind: 'label', name: c.name, sound: capoSound(c.name, capo, s.soundFlats), beat: c.beat, beats: c.beats, shape: shp, lyric: c.lyric, voicing: (T.piano ? T.v : shapeMidis(inst, T.sh)).map(m => m + capo) });
    for (let k = 0; k * grid < c.beats - 1e-6; k++) {
      const tok = toks[k % toks.length];
      if (tok === '-' || tok === '.') continue;
      const parts = tok.split('+');
      const made = parts.map(p => pickOne(inst, T, p)).filter(Boolean).sort((a, b) => b.midi - a.midi);
      // how long this note rings before the next sounded cell
      let len = 1; while ((k + len) * grid < c.beats - 1e-6 && ['-', '.'].includes(toks[(k + len) % toks.length])) len++;
      if (capo) made.forEach(m => { m.midi += capo; });
      made.forEach((m, j) => out.push(Object.assign(m, { kind: j === 0 ? 'note' : 'guide', solid: j > 0, ring: true, beat: c.beat + k * grid, beats: grid * len, short: true })));
    }
  }
  return out;
}
function pickOne(inst, T, p) {
  if (T.piano) {
    if (p === 'T' || p === 'B') return { midi: p === 'T' ? T.bass : T.bass + 7, finger: '' };
    const k = parseInt(p, 10);
    if (!k) return null;
    if (k === 8) return { midi: T.v[0] + 12 + (T.shift || 0), finger: '' };
    const idx = (k - 1) % T.v.length, oct = Math.floor((k - 1) / T.v.length);
    return { midi: T.v[idx] + 12 * oct + (T.shift || 0), finger: '' };
  }
  let sIdx, thumb = false;
  if (p.includes('/')) {
    const [a, b] = p.split('/').map(x => parseInt(x, 10));
    sIdx = T.n - a;
    return { midi: T.tun[sIdx] + b, s: sIdx, f: b, finger: pickFinger(inst, sIdx, T.n, false) };
  }
  if (p === 'T') { sIdx = T.rootIdx; thumb = true; }
  else if (p === 'B') { sIdx = T.altIdx; thumb = true; }
  else {
    const k = parseInt(p, 10);
    if (!k) return null;
    sIdx = T.n - k;
    if (!T.played.includes(sIdx)) sIdx = T.played.slice().sort((a, b) => Math.abs(a - sIdx) - Math.abs(b - sIdx))[0];
  }
  return { midi: T.tun[sIdx] + T.sh.frets[sIdx], s: sIdx, f: T.sh.frets[sIdx], finger: pickFinger(inst, sIdx, T.n, thumb) };
}

/** Lesson-page picture of a picking pattern: string lanes with finger letters. */
function pickDiagram(inst, pat, { chord = null, grid = 0.5, bpm = 72, sig = 4 } = {}) {
  const name = chord || (inst === 'ukulele' ? 'C' : inst === 'piano' ? 'C' : 'Am');
  if (Array.isArray(pat)) pat = pat[0];
  const beats = Math.max(sig, String(pat).trim().split(/\s+/).length * grid);
  const ev = pickEvents(inst, { chords: `${name}:${beats}`, pick: pat, pickGrid: grid, sig }).filter(e => e.kind === 'note' || e.kind === 'guide');
  let html;
  if (INSTRUMENTS[inst].kind === 'fretted') {
    const n = INSTRUMENTS[inst].tuning.length, W = 320, lh = 22, top = 16, left = 26, H = top + n * lh + 22;
    const cw = (W - left - 8) / (beats / grid);
    let g = '';
    for (let s = 0; s < n; s++) { const y = top + (n - 1 - s) * lh + lh / 2; g += `<line x1="${left}" y1="${y}" x2="${W - 4}" y2="${y}" class="pd-line"/><text x="6" y="${y + 4}" class="pd-str">${INSTRUMENTS[inst].strings[s]}</text>`; }
    for (let b = 0; b <= beats; b++) { const x = left + (b / grid) * cw; g += `<line x1="${x}" y1="${top}" x2="${x}" y2="${top + n * lh}" class="pd-bar${b % sig === 0 ? ' strong' : ''}"/>`; if (b < beats) g += `<text x="${x + cw / 2}" y="${H - 6}" class="pd-count">${b % sig + 1}</text>`; }
    ev.forEach(e => { const x = left + (e.beat / grid) * cw + cw / 2, y = top + (n - 1 - e.s) * lh + lh / 2; g += `<circle cx="${x}" cy="${y}" r="9.5" class="pd-dot f-${e.finger}"/><text x="${x}" y="${y + 4}" class="pd-f">${e.finger}</text>`; });
    html = `<svg viewBox="0 0 ${W} ${H}" class="pick-svg" role="img" aria-label="Picking pattern">${g}</svg>`;
  } else {
    html = `<div class="pick-keys">${ev.map(e => `<span>${esc(noteLabel(e.midi, false))}</span>`).join('')}</div>`;
  }
  const play = () => {
    const kind = INSTRUMENTS[inst].synth, spb = 60 / bpm, t0 = Engine.ensure().currentTime + 0.1;
    let end = t0;
    for (let rep = 0; rep < 2; rep++) ev.forEach(e => { end = Math.max(end, Synth.play(kind, e.midi, t0 + (rep * beats + e.beat) * spb, { gain: 0.7, dur: Math.max(0.6, spb * 2) })); });
    Engine.mute(end + 0.3);
  };
  return h('button', { class: 'strum-fig pick-fig', onclick: play, title: 'Tap to hear' }, h('div', { html }),
    h('span', { class: 'strum-cap' }, icon('volume', 14), INSTRUMENTS[inst].kind === 'fretted' ? `Tap to hear · on ${chordLabel(name)} · p = thumb, i = index, m = middle, a = ring` : `Tap to hear · on ${chordLabel(name)}`));
}

  const status = h('p', { class: 'muted' }, s.mode === 'crescendo' ? 'Start softly and get gradually louder, staying on the note.' : s.mode === 'vibrato' ? 'Hold the note and let a gentle, even vibrato appear.' : 'Breathe in, then hold the note as steadily as you can.');

  const btn = h('button', { class: 'btn primary', onclick: () => go() }, icon('volume', 18), 'Hear the note & start');
  const el = h('div', { class: 'step step-sustain' }, s.title && h('h2', { class: 'step-title' }, s.title), s.text && h('div', { class: 'prose', html: md(s.text) }),

function songChordNames(song, inst) {
  const key = (song.keys && song.keys[inst]) || song.key;
  const tr = mod12(parsePc(key) - parsePc(song.key) + 6) - 6;
  const names = [];
  parseChords(song.chords, song.sig).forEach(c => { if (c.name) { const n = tr ? transposeChord(c.name, tr, FLAT_KEYS.includes(key)) : c.name; if (!names.includes(n)) names.push(n); } });
  return names;
}

/* Give every chapter and lesson a stable id: g1-3, p2-1, … */
(function assignIds() {
  const pre = { guitar: 'g', piano: 'p', ukulele: 'u', voice: 'v' };
  for (const [inst, chs] of Object.entries(COURSES)) {

/** Scale run up (and back down) as a melody string. */
function run(root, scale, { oct = 1, down = true, dur = 1, last = 2 } = {}) {
  const r = parseNote(root);
  let up = [];
  for (let o = 0; o < oct; o++) SCALES[scale].forEach(i => up.push(r + 12 * o + i));
  up.push(r + 12 * oct);
  const all = down ? up.concat(up.slice(0, -1).reverse()) : up;
  return all.map((m, i) => noteName(m) + ':' + (i === all.length - 1 ? last : dur)).join(' ');
}

/* ==========================================================================

   ========================================================================== */
(function () {
  const FOLK = 'D - D U - U D U';
  const ALPHABET = '**A · A♯/B♭ · B · C · C♯/D♭ · D · D♯/E♭ · E · F · F♯/G♭ · G · G♯/A♭ · A**\n\nThere is **no sharp between B and C, or between E and F**.';
  const openMarks = (inst, capo) => INSTRUMENTS[inst].tuning.map((t, s) => ({ s, f: capo, label: pcName(t + capo, false).replace('#', '♯'), root: true }));

  /* ======================= GUITAR ======================= */
  const gc = TRACKS.guitar.find(t => t.id === 'gc');
  gc.blurb = 'Faster chord changes, the capo, barre chords step by step, and colour chords all over the neck.';

  const basics = CH('Capo, step by step', 'Beginner', 'Put a capo on, play easy shapes in any key and choose the right fret for every song.', [
    L('What a capo does', [
      info('A **capo** (say “KAY-po”) is a clamp that presses all six strings down at one fret. It works like a new nut: the strings now ring from the capo instead of from the top of the neck.\n\nEvery fret you move it raises **every note by one half step**. Your chord shapes stay the same, but they sound higher. That is the whole trick: easy open shapes in any key.\n\nWith the capo on fret 2, the open strings become **F♯ B E A C♯ F♯**.', { fret: { marks: openMarks('guitar', 2), from: 0, to: 5, capo: 2 } }),
      info('Listen to the same **G shape** twice: first without a capo, then with the capo on fret 2. The second one sounds like an **A** chord, because G moved up two half steps is A.', { chordsShow: ['G', 'G|2'], listen: [{ label: 'G shape, no capo', chord: 'G' }, { label: 'G shape, capo 2', chord: 'G', capo: 2 }] }),
      quiz('What does a capo do?', ['Raises every string by the same amount', 'Makes the guitar louder', 'Tunes the strings for you', 'Mutes the strings under it'], 0, 'It clamps every string at one fret, so everything you play sounds higher by the same amount.'),
      quiz('You move the capo from fret 2 to fret 3. The song now sounds…', ['One half step higher', 'One half step lower', 'Exactly the same', 'A whole octave higher'], 0, 'Each fret is one half step. Moving up one fret raises the song by a half step.'),
    ]),
    L('Put it on the right way', [
      info('1. **Tune first, without the capo.**\n2. Put the capo **close behind the fret**, where your fingertip would press. Not on top of the metal fret, and not in the middle of the space.\n3. Keep it **straight**, along the fret.\n4. Use **just enough pressure** for clean notes. Too tight pulls the strings out of tune.\n5. Play every string. If one buzzes, slide the capo a little closer to the fret.', { fret: { marks: [], from: 0, to: 5, capo: 2 } }),
      notes('F#2@6 B2@5 E3@4 A3@3 C#4@2 F#4@1', { capo: 2, title: 'Capo on fret 2: every open string', text: 'Put the capo on fret 2 and play each string **open**, without any fingers. The app checks that every string rings clearly and in tune.' }),
      info('Chord pictures with a capo count frets **from the capo**. Treat the capo as the top of the neck: “fret 2” in the picture means the second fret after the capo. The thick grey bar is the capo.', { chordsShow: ['Em'], capo: 2 }),
      chords('Em', { capo: 2, title: 'E minor shape with the capo on', text: 'Keep the capo on fret 2 and play the E minor shape. It sounds as F♯ minor.' }),

    L('Same shapes, new key', [
      info('With the capo on fret 2, the **G, C and D shapes** sound as **A, D and E**. Songs in the key of A become as easy as songs in G.', { chordsShow: ['G', 'C', 'D'], capo: 2 }),
      chords('G C D', { capo: 2, title: 'Play the shapes with the capo on fret 2' }),
      play({ chords: 'G:4 C:4 D:4 G:4', capo: 2, bpm: 66, wait: true, title: 'Three chords in A' }),
      play({ chords: 'G:4 Em:4 C:4 D:4', capo: 2, strum: FOLK, bpm: 72, title: 'With the folk strum', text: 'Strum **down, down-up, up-down-up** and change chords on beat 1.' }),
    ]),
    L('Work out the new chord name', [
      info('Each fret adds one half step. To find the chord you hear, count up the musical alphabet, one step per fret:\n\n' + ALPHABET + '\n\nExample: an **E minor** shape with the capo on fret 3: E → F → F♯ → G. It sounds as **G minor**. The chord type never changes: minor stays minor, 7 stays 7.'),
      quiz('C shape, capo on fret 2. Which chord do you hear?', ['D', 'C♯', 'E', 'B♭'], 0, 'C → C♯ → D. Two frets, two half steps.'),
      quiz('E minor shape, capo on fret 3. Which chord do you hear?', ['G minor', 'G major', 'F♯ minor', 'A minor'], 0, 'E → F → F♯ → G, and minor stays minor.'),
      quiz('D shape, capo on fret 2. Which chord do you hear?', ['E', 'D♯', 'F', 'E minor'], 0, 'D → D♯ → E.'),
      quiz('A7 shape, capo on fret 1. Which chord do you hear?', ['B♭7', 'B7', 'A7', 'C7'], 0, 'A → A♯, which is also called B♭. The 7 stays: B♭7.'),
      quiz('G shape, capo on fret 5. Which chord do you hear?', ['C', 'B', 'D', 'A'], 0, 'G → G♯ → A → A♯ → B → C. Five frets, five half steps.'),
    ]),
    L('Find the capo for a hard key', [
      info('Some keys are full of barre chords. A song in **B♭** uses B♭, E♭ and F, and all three are barre chords. Look for easy shapes a few frets **below** and put the capo there:\n\n- **Capo 1:** play A shapes (A, D, E)\n- **Capo 3:** play G shapes (G, C, D)\n\nBoth sound in B♭. The **Capo calculator** in Tools works this out for any song.', { chordsShow: ['G|3', 'C|3', 'D|3'] }),
      quiz('A song uses B♭, E♭ and F. With the capo on fret 3, which shapes do you play?', ['G, C and D', 'A, D and E', 'E, A and B', 'C, F and G'], 0, 'Three half steps below B♭ is G (B♭ → A → A♭ → G), so you play the G-family shapes.'),
      chords('G C D', { capo: 3, title: 'B♭, E♭ and F, the easy way' }),

    L('A capo for your voice', [
      info('The capo is also the quickest way to move a song into a key that suits your voice.\n\n- Song too **low** to sing? Move the capo **up** a fret and play the same shapes.\n- Too **high**? Move the capo down, or take it off.\n\nGo one fret at a time and sing the first line each time until it feels easy. On the **Songs** tab, every song has a **Capo** setting. Choose **Keep the shapes** to raise the key without learning new chords.'),

    L('Song: Canon in the original key', [

  const pro = CH('Capo like a pro', 'Pro', 'Capo or barre, sparkly high-capo parts and two guitars that sound bigger than one.', [

      chords('G', { capo: 2, title: 'G shape, capo on fret 2' }),
      chords('A', { shapes: { A: ['577655', '134211'] }, title: 'A barre chord at the 5th fret', text: 'Take the capo off. Make an E shape with fingers 2, 3 and 4, and lay your first finger across all six strings at the 5th fret.' }),
    ]),
    L('High capo sparkle', [
      info('Put the capo high, on **fret 7**, and play G, C and D shapes. They sound as **D, G and A**, bright and light, almost like a mandolin.\n\nPlayers use a high capo for a second guitar part that sits **above** the main part instead of copying it.', { chordsShow: ['G|7', 'C|7', 'D|7'] }),

    ]),
    L('Two guitars, one song', [
      info('When two guitarists strum the same open chords, the sound gets crowded. Instead, one plays **open shapes** and the other plays **different shapes with a capo**. Same chords, different notes, a much bigger sound:\n\n- Guitar 1, no capo: **G · C · D · Em7**\n- Guitar 2, capo 5: **D · G · A · Bm7**\n\nCheck it: D up five half steps is G, G up five is C, A up five is D, and Bm7 up five is Em7.', { chordsShow: ['D|5', 'G|5', 'A|5', 'Bm7|5'] }),
      quiz('Guitar 1 plays an open C chord. Guitar 2 has the capo on fret 5. Which shape plays the same chord?', ['G shape', 'C shape', 'F shape', 'A shape'], 0, 'Count down five half steps from C: B, B♭, A, A♭, G.'),
      play({ chords: 'D:4 G:4 A:4 Bm7:4 D:4 G:4 A:4 D:4', capo: 5, strum: FOLK, bpm: 76, title: 'Play guitar 2’s part', text: 'Capo on fret 5. Your D, G, A and Bm7 shapes sound as G, C, D and Em7.' }),
    ]),
    L('Song: Night Drive with capo 7', [
      song('nightdrive', { capo: 7, text: 'Night Drive is in **B minor** and full of barre chords. With the capo on fret 7 it turns into **Em, C, G and D** shapes, and it still sounds in B minor.' }),
    ]),

  /* ======================= UKULELE ======================= */
  TR('ukulele', 'uc', 'Capo & keys', 'capo', 'Play your easy chords in any key, and change the key to suit your voice.', [
    CH('Capo basics', 'Beginner', 'What a capo does, how to put it on and how to name the chords you hear.', [
      L('What a capo does', [
        info('A **capo** (say “KAY-po”) clamps all four strings at one fret. Every fret you move it raises every note by **one half step**. Your chord shapes stay the same, but they sound higher.\n\nWith the capo on fret 2, the open strings **G C E A** become **A D F♯ B**.', { fret: { marks: openMarks('ukulele', 2), from: 0, to: 5, capo: 2 } }),
        info('Listen to the same **C shape** twice: first without a capo, then with the capo on fret 2. The second one sounds like a **D** chord, because C moved up two half steps is D.', { chordsShow: ['C', 'C|2'], listen: [{ label: 'C shape, no capo', chord: 'C' }, { label: 'C shape, capo 2', chord: 'C', capo: 2 }] }),
        quiz('What does a capo do?', ['Raises every string by the same amount', 'Makes the ukulele louder', 'Tunes the strings for you', 'Mutes the strings under it'], 0, 'It clamps every string at one fret, so everything sounds higher by the same amount.'),
      ]),
      L('Put it on and check every string', [
        info('1. **Tune first, without the capo.**\n2. Put the capo **close behind the fret**, not on top of it.\n3. Keep it straight and only as tight as it needs to be.\n4. Play every string. If one buzzes, move the capo a little closer to the fret.\n\nChord pictures with a capo count frets **from the capo**. The thick grey bar is the capo.', { chordsShow: ['C'], capo: 2 }),
        notes('A4@4 D4@3 F#4@2 B4@1', { capo: 2, title: 'Capo on fret 2: every open string', text: 'Play each string **open**. The app checks that every string rings clearly and in tune.' }),
        chords('C', { capo: 2, title: 'C shape with the capo on', text: 'Keep the capo on fret 2 and play the C shape. It sounds as D.' }),
      ]),
      L('Same shapes, new key', [
        info('With the capo on fret 2, the **C, F and G7 shapes** sound as **D, G and A7**. Songs in D become as easy as songs in C.', { chordsShow: ['C', 'F', 'G7'], capo: 2 }),
        chords('C F G7', { capo: 2, title: 'Play the shapes with the capo on fret 2' }),
        play({ chords: 'C:4 F:4 G7:4 C:4', capo: 2, bpm: 66, wait: true, title: 'Three chords in D' }),
        play({ chords: 'C:4 Am:4 F:4 G7:4', capo: 2, strum: FOLK, bpm: 76, title: 'With the island strum', text: 'Strum **down, down-up, up-down-up**.' }),
      ]),
      L('Work out the new chord name', [
        info('Each fret adds one half step. Count up the musical alphabet, one step per fret:\n\n' + ALPHABET + '\n\nThe chord type never changes: minor stays minor, 7 stays 7.'),
        quiz('C shape, capo on fret 3. Which chord do you hear?', ['E♭', 'D', 'E', 'F'], 0, 'C → C♯ → D → E♭. Three frets, three half steps.'),
        quiz('Am shape, capo on fret 2. Which chord do you hear?', ['B minor', 'B♭ minor', 'C minor', 'A♯'], 0, 'A → A♯ → B, and minor stays minor.'),
        quiz('F shape, capo on fret 2. Which chord do you hear?', ['G', 'F♯', 'A', 'G minor'], 0, 'F → F♯ → G.'),
        quiz('G7 shape, capo on fret 5. Which chord do you hear?', ['C7', 'C', 'D7', 'B7'], 0, 'G → G♯ → A → A♯ → B → C, and the 7 stays.'),

/* ---------------- ids, lookup tables ----------------
   Lesson ids are saved with your progress, so they must never change.
   Chapters number themselves 1, 2, 3… in order. A chapter added later carries
   its own fixed key (cid) so the numbers of the older chapters stay the same. */
(function assignTrackIds() {
  for (const [inst, tracks] of Object.entries(TRACKS)) {
    tracks.forEach(tr => {
      const group = [];
      let num = 0;
      tr.chapters.forEach((ch, ci) => {
        const key = ch.cid || String(++num);
        ch.id = `${tr.id}${key}`; ch.inst = inst; ch.track = tr;
        ch.lessons.forEach((l, li) => { l.id = `${tr.id}${key}-${li + 1}`; l.inst = inst; l.chapter = ci; l.index = li; l.track = tr; l.ch = ch; l.group = group; group.push(l); ALL_LESSONS.push(l); LESSON_BY_ID[l.id] = l; });
      });
      tr.lessons = group;
    });
  }
})();
const TRACK_BY_ID = Object.fromEntries(Object.values(TRACKS).flat().map(t => [t.id, t]));

const PROGRESSIONS = [
  { name: 'Pop anthem', roman: [0, 4, 5, 3] },        // I V vi IV
  { name: 'Emotional', roman: [5, 3, 0, 4] },         // vi IV I V
  { name: '50s doo-wop', roman: [0, 5, 3, 4] },       // I vi IV V
  { name: 'Folk', roman: [0, 3, 0, 4] },              // I IV I V
  { name: 'Rock', roman: [0, 3, 4, 3] },              // I IV V IV
  { name: 'Jazz ii–V–I', roman: [1, 4, 0, 0] },       // ii V I I
  { name: 'Climb', roman: [0, 1, 2, 3] },             // I ii iii IV
  { name: 'Ballad', roman: [0, 2, 3, 4] },            // I iii IV V
];
const PROGRESSIONS_MINOR = [
  { name: 'Epic', roman: [0, 5, 6, 0] },              // i VI VII i
  { name: 'Classic minor', roman: [0, 3, 4, 0] },     // i iv v i
  { name: 'Spanish', roman: [0, 6, 5, 6] },           // i VII VI VII
  { name: 'Moody', roman: [0, 3, 6, 2] },             // i iv VII III
  { name: 'Rise', roman: [5, 6, 0, 0] },              // VI VII i i
  { name: 'Story', roman: [0, 5, 2, 6] },             // i VI III VII
];

const Studio = {
  all() { return Store.get('songs', []); },
  get(id) { return this.all().find(s => s.id === id); },
  save(song) {
    song.updated = Date.now();
    Store.update('songs', list => { const i = list.findIndex(s => s.id === song.id); if (i >= 0) list[i] = song; else list.unshift(song); return list; }, []);
  },
  remove(id) { Store.update('songs', list => list.filter(s => s.id !== id), []); },
  create(t = {}) {
    const song = Object.assign({
      id: 's' + Date.now().toString(36) + Math.floor(Math.random() * 1e4).toString(36),
      title: 'Untitled song', instrument: Settings.get('instrument'), key: 'C', bpm: 84, sig: 4, strum: 'quarter',
      sections: [{ name: 'Verse', bars: ['C', 'G', 'Am', 'F'], lyrics: '' }], melody: '', created: Date.now(),
    }, JSON.parse(JSON.stringify(t)));
    if (song.instrument === 'voice' && !t.instrument) song.instrument = 'voice';
    this.save(song);
    return song;
  },
  /** Chord track string with lyric lines spread over each section's bars. */
  chordTrack(song) {
    const parts = [];
    for (const sec of song.sections) {
      const lines = (sec.lyrics || '').split('\n').map(x => x.trim()).filter(Boolean);
      const n = sec.bars.length;
      const starts = {};
      lines.forEach((line, i) => { starts[Math.floor(i * n / lines.length)] = line; });
      sec.bars.forEach((c, i) => {
        const lyric = starts[i] ? `"${starts[i].replace(/"/g, '')}"` : '';
        parts.push(`${c || 'N'}:${song.sig}${lyric}`);
      });
    }
    return parts.join(' ');
  },
  totalBeats(song) { return song.sections.reduce((a, s) => a + s.bars.length, 0) * song.sig; },
  exportCode(song) { return 'TONIC1:' + btoa(unescape(encodeURIComponent(JSON.stringify(song)))); },
  importCode(code) {
    const m = /TONIC1:([A-Za-z0-9+/=]+)/.exec(code.trim());
    if (!m) throw new Error('Not a song code');
    const s = JSON.parse(decodeURIComponent(escape(atob(m[1]))));
    if (!s.sections) throw new Error('Not a song code');
    s.id = 's' + Date.now().toString(36);
    this.save(s);
    return s;
  },
};

/** Turn a pitch track into notes on an eighth-note grid. */
function quantizeMelody(frames, totalBeats) {
  const segs = [];
  let cur = null;
  for (const f of frames) {
    const r = f.midi === null ? null : Math.round(f.midi);
    if (cur && r !== null && Math.abs(r - cur.m) <= 0 && f.beat - cur.end < 0.15) { cur.end = f.beat; cur.vals.push(f.midi); continue; }

    if (Engine.state !== 'on' && !(await Engine.startMic())) { toast('Microphone needed'); return; }
    try { rec = new MediaRecorder(Engine.E.stream); } catch (e) { rec = null; toast('Recording is not available here.'); return; }
    chunks = []; t0 = Date.now();
    rec.ondataavailable = e => { if (e.data && e.data.size) chunks.push(e.data); };
    rec.onstop = () => {
      const type = rec.mimeType || 'audio/webm';
      const blob = new Blob(chunks, { type });
      TAKES.unshift({ url: URL.createObjectURL(blob), secs: (Date.now() - t0) / 1000, at: new Date(), ext: /mp4|aac/.test(type) ? 'm4a' : /ogg/.test(type) ? 'ogg' : 'webm' });
      while (TAKES.length > 5) URL.revokeObjectURL(TAKES.pop().url);
      rec = null; clearInterval(timer); btn.classList.remove('on'); clear(btn).append(icon('record', 34)); Practice.active = false;
      renderList();
    };
    rec.start();
    btn.classList.add('on'); clear(btn).append(icon('stop', 34)); Practice.active = true;
    timer = setInterval(() => { const s = (Date.now() - t0) / 1000; time.textContent = fmt(s); if (s > 600) rec && rec.stop(); }, 250);
  }
  const off = Engine.on(f => { meter.firstChild.style.width = Math.round(f.level * 100) + '%'; });
  view.append(h('p', { class: 'muted' }, 'Record yourself playing or singing, then listen back. Hearing yourself from the outside is the fastest way to spot timing and tuning problems.'),
    h('div', { class: 'recorder' }, time, meter, btn, h('small', { class: 'muted' }, 'Tap to record · up to 10 minutes')),
    h('h3', { class: 'section-title' }, 'Your takes'), list,
    h('p', { class: 'muted small' }, 'Takes stay on this phone only and disappear when you close the app. Tap “Save to phone” to keep one.'));
  renderList();
  const g = micGate(view);
  reg(() => { off(); g(); clearInterval(timer); if (rec) { try { rec.stop(); } catch (e) { /* already stopped */ } } Practice.active = false; });
}

/* ---- capo.js ---- */
/* ==========================================================================
   Capo: chord-name helpers, the song capo setting and the capo calculator.
   --------------------------------------------------------------------------
   Convention everywhere in the app: a chord chart lists the SHAPES you fret.
   `capo: k` raises the sound by k half steps. Diagrams show the shape (frets
   counted from the capo); the microphone listens for the sounding chord.
   ========================================================================== */

const CAPO_MAX = 9;
const MAJOR_KEY_NAMES = ['C', 'Db', 'D', 'Eb', 'E', 'F', 'F#', 'G', 'Ab', 'A', 'Bb', 'B'];
const MINOR_KEY_NAMES = ['Cm', 'C#m', 'Dm', 'Ebm', 'Em', 'Fm', 'F#m', 'Gm', 'G#m', 'Am', 'Bbm', 'Bm'];
const MINORISH = new Set(['m', 'm7', 'm6', 'm9', 'dim', 'dim7', 'm7b5']);

/** Spell a chord the way chord sheets usually do when no key is known: B♭, E♭, A♭, D♭, F♯; C♯m, F♯m, G♯m. */
function niceChord(name) {
  const c = parseChord(name);
  if (!c) return name;
  const minor = MINORISH.has(c.type);
  const root = mod12(c.root);
  const sp = { 1: minor ? 'C#' : 'Db', 3: 'Eb', 6: 'F#', 8: minor ? 'G#' : 'Ab', 10: 'Bb' }[root] || pcName(root, false);
  let out = sp + rawTypeOf(name);
  if (c.bass !== null) out += '/' + ({ 1: 'C#', 3: 'Eb', 6: 'F#', 8: 'Ab', 10: 'Bb' }[mod12(c.bass)] || pcName(c.bass, false));
  return out;
}
/** The chord you hear when you fret `name` with the capo on fret `capo`. */
function capoSound(name, capo, flats) {
  if (!capo) return name;
  return flats === undefined || flats === null ? niceChord(transposeChord(name, capo, false)) : transposeChord(name, capo, flats);
}
function keyNameOf(pc, minor) { return (minor ? MINOR_KEY_NAMES : MAJOR_KEY_NAMES)[mod12(pc)]; }
function isFlatKey(k) { return FLAT_KEYS.includes(k); }

/** Small banner shown above exercises that use a capo. */
function capoNote(capo, soundKey) {
  return h('div', { class: 'capo-note' }, h('span', { class: 'capo-chip' }, 'Capo ' + capo),
    h('span', null, soundKey ? `Play the shapes shown. It sounds in ${chordLabel(soundKey)}.` : 'Play the shapes shown. Count frets from the capo.'));
}

/* ---------------- How easy is a chord shape? ---------------- */
/** 1 = easy open chord, 2 = harder open chord, 3 = barre or awkward, 4 = high barre, 9 = no shape. */
function shapeEase(inst, name) {
  const dict = inst === 'ukulele' ? UKE_SHAPES : GUITAR_SHAPES;
  const known = altNames(String(name).split('/')[0]).some(n => dict[n]);
  const sh = shapeFor(inst, name);
  if (!sh) return 9;
  const fr = sh.frets.filter(f => f > 0);
  const maxF = fr.length ? Math.max(...fr) : 0, minF = fr.length ? Math.min(...fr) : 0;
  const fingers = sh.fingers || [];
  const barre = fingers.filter((g, i) => g === 1 && sh.frets[i] === minF && minF > 0).length >= 2;
  const open = sh.frets.some(f => f === 0);
  if (!known) return maxF > 9 ? 4 : 3;
  if (barre) return 3;
  if (open && maxF <= 3 && fr.length <= 3) return 1;
  if (fr.length >= 4 && maxF >= 4) return 3;
  if (maxF <= 4) return 2;
  return 3;
}
const EASE_LABEL = ['', 'Easy', 'Medium', 'Hard'];
/** Every capo position for a list of sounding chords, easiest first. */
function capoOptions(inst, sounds) {
  const uniq = [...new Set(sounds)];
  const out = [];
  for (let capo = 0; capo <= CAPO_MAX; capo++) {
    const shapes = uniq.map(c => niceChord(transposeChord(c, -capo, false)));
    const eases = shapes.map(c => shapeEase(inst, c));
    const mean = eases.reduce((a, b) => a + b, 0) / Math.max(1, eases.length);
    const cramped = capo > (inst === 'ukulele' ? 5 : 7) ? 0.6 : 0;
    const level = mean <= 1.15 ? 1 : mean <= 1.8 ? 2 : 3;
    out.push({ capo, shapes, sounds: uniq, eases, mean, level, cost: mean + capo * 0.04 + cramped, ok: eases.every(e => e < 9) });
  }
  return out.filter(o => o.ok).sort((a, b) => a.cost - b.cost);
}

/* ---------------- Capo on songs ---------------- */
/**
 * keep 'key'    -> the song sounds in its usual key; the shapes move down by `capo`
 * keep 'shapes' -> you keep the usual shapes; the song sounds `capo` half steps higher
 */
function capoPlan(song, inst, st = {}) {
  const base = (song.keys && song.keys[inst]) || song.key;
  const baseShift = mod12(parsePc(base) - parsePc(song.key) + 6) - 6;
  const capo = clamp((st.capo | 0), 0, CAPO_MAX);
  const keepShapes = st.keep === 'shapes';
  const minor = /m$/.test(base);
  const soundShift = baseShift + (keepShapes ? capo : 0);
  const shapeShift = soundShift - capo;
  const soundKey = keyNameOf(parsePc(song.key) + soundShift, minor);
  const shapesKey = keyNameOf(parsePc(song.key) + shapeShift, minor);
  return { capo, keep: keepShapes ? 'shapes' : 'key', base, soundKey, shapesKey, soundShift, shapeShift, soundFlats: isFlatKey(soundKey), shapeFlats: isFlatKey(shapesKey) };
}
/** [{shape, sound}] for each different chord in the song, in order of first use. */
function capoChordList(song, plan) {
  const seen = new Set(), out = [];
  parseChords(song.chords, song.sig).forEach(c => {
    if (!c.name) return;
    const shape = transposeChord(c.name, plan.shapeShift, plan.shapeFlats);
    if (seen.has(shape)) return;
    seen.add(shape);
    out.push({ shape, sound: transposeChord(c.name, plan.soundShift, plan.soundFlats) });
  });
  return out;
}
function songCapoState(song, inst) { return (Store.get('songCapo', {})[inst + ':' + song.id]) || { capo: 0, keep: 'key' }; }

/** The capo card on a song page. Calls onChange() after every change. */
function songCapoCard(song, inst, onChange) {
  const st = songCapoState(song, inst);
  const plan = capoPlan(song, inst, st);
  const base = capoPlan(song, inst, { capo: 0 });
  const set = patch => { setSongCapoState(song, inst, Object.assign({}, st, patch)); onChange(); };
  const list = capoChordList(song, plan);
  const opts = capoOptions(inst, capoChordList(song, base).map(c => c.sound));
  const best = opts[0], cur = opts.find(o => o.capo === (plan.keep === 'key' ? plan.capo : 0));
  const stepper = h('div', { class: 'stepper' },
    h('button', { class: 'btn ghost sm', 'aria-label': 'Capo down', disabled: plan.capo <= 0, onclick: () => set({ capo: plan.capo - 1 }) }, '−'),
    h('b', null, plan.capo ? 'Fret ' + plan.capo : 'None'),
    h('button', { class: 'btn ghost sm', 'aria-label': 'Capo up', disabled: plan.capo >= CAPO_MAX, onclick: () => set({ capo: plan.capo + 1 }) }, '+'));
  const card = h('div', { class: 'card capo-card' + (plan.capo ? ' on' : '') },
    h('div', { class: 'row between' }, h('span', null, h('b', null, 'Capo'), h('small', { class: 'muted block' }, `Usual key here: ${chordLabel(base.soundKey)}`)), stepper));
  if (plan.capo) {
    card.append(h('div', { class: 'seg' },
      h('button', { class: plan.keep === 'key' ? 'on' : '', onclick: () => set({ keep: 'key' }) }, 'Keep the key'),
      h('button', { class: plan.keep === 'shapes' ? 'on' : '', onclick: () => set({ keep: 'shapes' }) }, 'Keep the shapes')));
    card.append(h('p', { class: 'small capo-explain' }, plan.keep === 'key'
      ? `It still sounds in ${chordLabel(plan.soundKey)}. You play ${chordLabel(plan.shapesKey)} shapes: ${list.map(c => chordLabel(c.shape)).join(' ')}.`
      : `You keep your usual shapes. The song sounds ${plan.capo} half step${plan.capo > 1 ? 's' : ''} higher, in ${chordLabel(plan.soundKey)}: handy if it is too low to sing.`));
  } else card.append(h('p', { class: 'small muted capo-explain' }, 'A capo lets you play this song with different shapes, or raise its key to suit your voice.'));
  if (plan.keep === 'key' && best && cur && best.capo !== plan.capo && (best.level < cur.level || best.mean < cur.mean - 0.25)) {
    card.append(h('button', { class: 'chip capo-tip', onclick: () => set({ capo: best.capo, keep: 'key' }) },
      icon('sparkle', 14), best.capo ? ` Easiest: capo ${best.capo} (${best.shapes.map(chordLabel).join(' ')})` : ` Easiest: no capo (${best.shapes.map(chordLabel).join(' ')})`));
  }
  return card;
}

/* ---------------- Capo calculator (Tools) ---------------- */
function keyChords(root, minor) {
  const k = keyInfo(keyNameOf(parsePc(root), minor));
  return minor ? [k.chords[0], k.chords[3], k.chords[5], k.chords[6]] : [k.chords[0], k.chords[3], k.chords[4], k.chords[5]];

function parseChordList(text) {

    .map(t => { const m = /^([a-gA-G])([#bB]?)(.*)$/.exec(t); return m ? m[1].toUpperCase() + m[2].replace('B', 'b') + (/^maj/i.test(m[3]) ? m[3].toLowerCase() : m[3].replace(/^M$/, 'm').toLowerCase()) : t; });
  return { good: [...new Set(toks.filter(t => parseChord(t)))], bad: toks.filter(t => !parseChord(t)) };
}

const Progress = {
  all() { return Store.get('progress', {}); },
  get(id) { return this.all()[id] || null; },
  record(lesson, score) {
    const stars = scoreToStars(score);
    const prog = this.all();
    const prev = prog[lesson.id];
    let xp = 0;
    if (!prev || !prev.done) xp = stars >= 1 ? 10 + stars * 10 : 2;
    else if (stars > prev.stars) xp = (stars - prev.stars) * 10;
    prog[lesson.id] = { stars: Math.max(stars, prev ? prev.stars : 0), best: Math.max(score, prev ? prev.best : 0), done: !!(prev && prev.done) || stars >= 1, at: Date.now() };
    Store.set('progress', prog);
    if (xp) Store.update('xp', x => x + xp, 0);
    this.touchStreak();
    Practice.afterLesson(lesson, stars);
    return { stars, xp };
  },
  touchStreak() {
    const today = new Date().toDateString();
    const st = Store.get('streak', { last: null, count: 0 });
    if (st.last === today) return;
    const yesterday = new Date(Date.now() - 864e5).toDateString();
    st.count = st.last === yesterday ? st.count + 1 : 1;
    st.last = today;
    Store.set('streak', st);
  },
  streak() {
    const st = Store.get('streak', { last: null, count: 0 });
    const today = new Date().toDateString(), yesterday = new Date(Date.now() - 864e5).toDateString();
    return st.last === today || st.last === yesterday ? st.count : 0;
  },

**Why this matters:** browsers only let a web page use the microphone when it runs on its own **https://** address. App previews inside chat apps block the microphone completely. Once Tonic has its own address, the mic works every time with one tap — and you can add it to your home screen like a normal app.

**Quickest test on a computer:** double-click **tonic.html** to open it in Chrome or Edge, then allow the microphone when asked.

**Put Tonic online for free (GitHub Pages, about 5 minutes, works from your phone):**
- Save the **tonic.html** file to your phone.
- Go to **github.com** and create a free account (or sign in). If a button is missing on your phone, switch the browser to **Desktop site**.
- Tap **+** › **New repository**. Name it \`tonic\`, choose **Public**, tap **Create repository**.
- Tap **uploading an existing file**, pick tonic.html, then tap **Commit changes**.
- Open **Settings** › **Pages**. Under “Branch” choose **main** and **/ (root)**, tap **Save**.
- After a minute or two your app is live at \`https://YOUR-USERNAME.github.io/tonic/tonic.html\` — bookmark it.

**Add it to your home screen:**
- **Android (Chrome):** menu ⋮ › **Add to Home screen**.
- **iPhone (Safari):** Share button › **Add to Home Screen**.

**Updating to a new version:** open your repository on github.com, tap **Add file** › **Upload files**, pick the new **tonic.html** and tap **Commit changes**. It replaces the old file. Wait a minute, then close and reopen the app. Your progress stays on your phone.

**Allow the microphone:**
- **Chrome:** tap the icon left of the address › **Permissions** › **Microphone** › Allow.
