:root {
  --bg: #0d0f15; --bg2: #12151d; --card: #181c26; --card2: #1f2431; --line: #2a3040; --text: #eef0f6; --muted: #98a0b3;
  --accent: #ff9f43; --accent-soft: #ff9f4333; --accent-mid: #ff9f4366; --ok: #34d399; --bad: #f87171; --warn: #fbbf24;
  --r: 16px; --r-sm: 11px; --shadow: 0 8px 28px rgba(0,0,0,.35);
  --top: calc(56px + env(safe-area-inset-top)); --bottom: calc(62px + env(safe-area-inset-bottom));
  color-scheme: dark;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; background: var(--bg); color: var(--text); font: 15px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; }
body { min-height: 100vh; padding: var(--top) 0 var(--bottom); overscroll-behavior-y: none; }
body.fullscreen { padding-bottom: env(safe-area-inset-bottom); }
body.fullscreen .tabbar { display: none; }
a { color: inherit; text-decoration: none; }
h1 { font-size: 26px; line-height: 1.15; margin: 0 0 4px; letter-spacing: -.02em; }
h2 { font-size: 20px; margin: 0 0 6px; letter-spacing: -.01em; }
h3 { font-size: 16px; margin: 0 0 8px; }
p { margin: 0 0 10px; }
.muted { color: var(--muted); }
.small { font-size: 13px; }
.center { text-align: center; justify-content: center; }
.row { display: flex; align-items: center; }
.row.gap { gap: 10px; }
.row.wrap { flex-wrap: wrap; }
.row.between { justify-content: space-between; }
.col { display: flex; flex-direction: column; gap: 8px; }
.ic { display: inline-flex; align-items: center; justify-content: center; flex: none; }
.ic svg { display: block; }
#view { max-width: 680px; margin: 0 auto; padding: 16px 16px 40px; }
code { background: var(--card2); padding: 1px 6px; border-radius: 6px; font-size: .92em; }

/* buttons & fields */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 44px; padding: 0 18px; border-radius: 999px; border: 1px solid transparent; font: 600 15px/1 system-ui, sans-serif; color: var(--text); background: var(--card2); cursor: pointer; transition: transform .08s ease, background .2s, opacity .2s; touch-action: manipulation; }
.btn:active { transform: scale(.97); }
.btn:disabled { opacity: .4; pointer-events: none; }
.btn.primary { background: var(--accent); color: #12131a; }
.btn.ghost { background: transparent; border-color: var(--line); }
.btn.danger { background: var(--bad); color: #160b0b; }
.btn.sm { min-height: 36px; padding: 0 13px; font-size: 14px; }
.btn.wide { width: 100%; }
.btn.round { width: 64px; height: 64px; padding: 0; border-radius: 50%; }
.btn.round.big { width: 92px; height: 92px; }
.btn.toggle.on { background: var(--accent-soft); border-color: var(--accent); color: var(--accent); }
.icon-btn { display: inline-flex; align-items: center; justify-content: center; width: 42px; height: 42px; border-radius: 50%; background: transparent; border: 0; color: var(--text); cursor: pointer; }
.danger-text { color: var(--bad) !important; }
.field { width: 100%; background: var(--bg2); color: var(--text); border: 1px solid var(--line); border-radius: var(--r-sm); padding: 11px 12px; font: inherit; }
.field:focus { outline: 2px solid var(--accent-mid); border-color: var(--accent); }
textarea.field { resize: vertical; min-height: 70px; }
select.field { appearance: none; background-image: linear-gradient(45deg, transparent 50%, var(--muted) 50%), linear-gradient(135deg, var(--muted) 50%, transparent 50%); background-position: calc(100% - 18px) 50%, calc(100% - 13px) 50%; background-size: 5px 5px; background-repeat: no-repeat; padding-right: 30px; }
input[type=range] { width: 100%; accent-color: var(--accent); }
.slider { display: grid; grid-template-columns: auto 1fr auto; gap: 10px; align-items: center; margin-top: 10px; }

/* top bar & tabs */
.topbar { position: fixed; inset: 0 0 auto 0; z-index: 30; display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; height: var(--top); padding: env(safe-area-inset-top) 10px 0; background: rgba(13,15,21,.86); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px); border-bottom: 1px solid rgba(255,255,255,.05); }
.tb-left { display: flex; align-items: center; }
.tb-title { font-weight: 700; font-size: 15px; text-align: center; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 46vw; }
.brand { display: flex; align-items: center; gap: 9px; font-weight: 800; font-size: 18px; letter-spacing: -.02em; padding-left: 4px; }
.logo { display: inline-flex; align-items: center; justify-content: center; width: 30px; height: 30px; border-radius: 9px; font-weight: 900; color: #10121a; background: conic-gradient(from 210deg, #ff9f43, #fb7185, #a78bfa, #2dd4bf, #ff9f43); }
.mic-pill { justify-self: end; display: inline-flex; align-items: center; gap: 6px; height: 36px; padding: 0 12px 0 10px; border-radius: 999px; border: 1px solid var(--line); background: var(--card); color: var(--muted); font: 600 13px system-ui, sans-serif; cursor: pointer; }
.mp-dot { width: 9px; height: 9px; border-radius: 50%; background: var(--muted); transition: transform .08s; }
.mic-pill[data-state=on] { color: var(--text); border-color: var(--accent); }
.mic-pill[data-state=on] .mp-dot { background: var(--accent); }
.mic-pill[data-state=on] .mp-dot.hot { background: var(--ok); }
.mic-pill[data-state=blocked], .mic-pill[data-state=error] { color: var(--bad); border-color: #f8717166; }
.mic-pill[data-state=blocked] .mp-dot, .mic-pill[data-state=error] .mp-dot { background: var(--bad); }
.tabbar { position: fixed; inset: auto 0 0 0; z-index: 30; display: flex; justify-content: space-around; height: var(--bottom); padding-bottom: env(safe-area-inset-bottom); background: rgba(13,15,21,.92); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px); border-top: 1px solid rgba(255,255,255,.06); }
.tab { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; font-size: 11px; font-weight: 600; color: var(--muted); }
.tab.on { color: var(--accent); }

/* learn */
.hero { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; margin: 4px 0 14px; }
.stats { display: flex; gap: 8px; }
.stat { display: inline-flex; align-items: center; gap: 4px; padding: 6px 10px; border-radius: 999px; background: var(--card); font-weight: 700; }
.stat .ic { color: var(--accent); }
.inst-switch { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin: 0 0 14px; }
.inst { --c: var(--accent); display: flex; flex-direction: column; align-items: center; gap: 3px; padding: 12px 4px 10px; border-radius: var(--r); border: 1px solid var(--line); background: var(--card); color: var(--muted); cursor: pointer; font: inherit; }
.inst b { color: var(--text); font-size: 13px; }
.inst small { font-size: 11px; }
.inst .ic { color: var(--c); }
.inst.on { border-color: var(--c); background: linear-gradient(180deg, color-mix(in srgb, var(--c) 18%, var(--card)), var(--card)); }
.continue-card { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 18px; border-radius: var(--r); background: linear-gradient(135deg, var(--accent-mid), var(--card) 70%); border: 1px solid var(--accent-mid); margin-bottom: 18px; box-shadow: var(--shadow); }
.continue-card small { color: var(--accent); font-weight: 700; text-transform: uppercase; letter-spacing: .06em; font-size: 11px; }
.continue-card h2 { margin: 4px 0 2px; }
.continue-card.done { background: var(--card); }
.play-circle { display: flex; align-items: center; justify-content: center; width: 58px; height: 58px; border-radius: 50%; background: var(--accent); color: #12131a; flex: none; }
.chapters { display: flex; flex-direction: column; gap: 10px; }
.chapter { border-radius: var(--r); background: var(--card); border: 1px solid var(--line); overflow: hidden; }
.ch-head { width: 100%; display: flex; align-items: center; gap: 12px; padding: 14px; background: none; border: 0; color: inherit; text-align: left; font: inherit; cursor: pointer; }
.ch-num { display: flex; align-items: center; justify-content: center; width: 34px; height: 34px; border-radius: 10px; background: var(--card2); font-weight: 800; color: var(--accent); flex: none; }
.ch-main { flex: 1; display: flex; flex-direction: column; min-width: 0; }
.ch-main b { font-size: 16px; }
.ch-main small { font-size: 12.5px; line-height: 1.35; }
.ch-level { font-size: 10.5px; font-weight: 800; letter-spacing: .08em; text-transform: uppercase; color: var(--accent); }
.ch-prog { display: flex; flex-direction: column; align-items: center; gap: 1px; flex: none; }
.ch-prog small { font-size: 10.5px; color: var(--muted); }
.ring-bg { fill: none; stroke: var(--card2); stroke-width: 4; }
.ring-fg { fill: none; stroke: var(--accent); stroke-width: 4; stroke-linecap: round; transition: stroke-dashoffset .5s; }
.lessons { display: none; padding: 0 10px 10px; }
.chapter.open .lessons { display: block; }
.lesson-row { display: flex; align-items: center; gap: 12px; padding: 11px 8px; border-radius: 12px; }
.lesson-row:hover, .lesson-row:active { background: var(--card2); }
.lesson-row.next { background: var(--accent-soft); }
.lesson-row.locked { opacity: .45; }
.lr-num { display: flex; align-items: center; justify-content: center; width: 28px; height: 28px; border-radius: 50%; border: 2px solid var(--line); font-size: 12px; font-weight: 800; flex: none; color: var(--muted); }
.lesson-row.next .lr-num { border-color: var(--accent); color: var(--accent); }
.lr-title { flex: 1; font-weight: 600; }
.lr-types { font-size: 11.5px; }
.stars { display: inline-flex; gap: 1px; }
.stars .on { color: #fcd34d; }
.stars .off { color: var(--line); }
.card { background: var(--card); border: 1px solid var(--line); border-radius: var(--r); padding: 16px; margin-bottom: 12px; }
.welcome { background: linear-gradient(160deg, #20263a, var(--card)); }
.ticks { padding-left: 0; list-style: none; margin: 0 0 14px; }
.ticks li { padding-left: 24px; position: relative; margin-bottom: 4px; }
.ticks li::before { content: '✓'; position: absolute; left: 4px; color: var(--ok); font-weight: 800; }

/* lesson */
.lesson { display: flex; flex-direction: column; min-height: calc(100vh - var(--top) - 30px); }
.lesson-head h1 { font-size: 22px; }
.lesson-prog { display: flex; gap: 5px; margin: 10px 0 16px; }
.lesson-prog i { flex: 1; height: 5px; border-radius: 3px; background: var(--card2); }
.lesson-prog i.done { background: var(--accent); }
.lesson-prog i.now { background: var(--accent-mid); }
.lesson-body { flex: 1; }
.lesson-foot { position: sticky; bottom: 0; display: flex; gap: 10px; align-items: center; padding: 12px 0 calc(8px + env(safe-area-inset-bottom)); background: linear-gradient(transparent, var(--bg) 30%); margin-top: 16px; }
.lesson-foot .btn.wide { flex: 1; }
.lesson-done { text-align: center; padding: 30px 0 10px; position: relative; overflow: hidden; }
.lesson-done h2 { font-size: 26px; margin-top: 10px; }
.confetti i { position: absolute; top: -20px; width: 8px; height: 14px; border-radius: 2px; background: var(--accent); animation: fall 1.6s ease-in forwards; opacity: .9; }
.confetti i:nth-child(3n) { background: #fcd34d; }
.confetti i:nth-child(3n+1) { background: var(--ok); width: 6px; }
@keyframes fall { to { transform: translateY(240px) rotate(540deg); opacity: 0; } }

/* steps */
.step-title { margin-bottom: 10px; }
.prose p { margin: 0 0 12px; }
.prose ul { margin: 0 0 12px; padding-left: 20px; }
.prose li { margin-bottom: 6px; }
.prose b { color: #fff; }
.figs { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; margin: 14px 0; }
.fig { background: var(--card); border: 1px solid var(--line); border-radius: var(--r); padding: 8px; color: inherit; font: inherit; }
.fig.chord-fig { width: 116px; cursor: pointer; }
.fig.big { width: 200px; margin: 0 auto; display: block; }
.fig.wide { width: 100%; overflow-x: auto; }
.fig.wide svg { width: 100%; height: auto; max-height: 190px; display: block; margin: 0 auto; }
.fig.piano-fig { width: 170px; }
.fig-cap { text-align: center; font-weight: 800; margin-bottom: 4px; }
.listen-row { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; margin: 8px 0; }
.quiz-q { font-size: 18px; font-weight: 700; }
.quiz-opts { display: flex; flex-direction: column; gap: 9px; margin: 12px 0; }
.quiz-opt { text-align: left; padding: 14px 16px; border-radius: var(--r-sm); border: 1px solid var(--line); background: var(--card); color: var(--text); font: 600 15px system-ui, sans-serif; cursor: pointer; }
.quiz-opt.right { border-color: var(--ok); background: #34d39922; }
.quiz-opt.wrong { border-color: var(--bad); background: #f8717122; }
.quiz-explain { padding: 12px 14px; border-radius: var(--r-sm); background: var(--card2); }
.quiz-explain.ok b { color: var(--ok); }
.quiz-explain.no b { color: var(--warn); }
.step-hint { color: var(--muted); }

.target-card { position: relative; text-align: center; padding: 18px 14px; border-radius: var(--r); background: var(--card); border: 1px solid var(--line); margin: 10px 0; }
.target-card.flash { animation: flash .5s ease; }
@keyframes flash { 0% { box-shadow: 0 0 0 0 #34d399aa; border-color: var(--ok); } 100% { box-shadow: 0 0 0 18px #34d39900; } }
.tc-name { font-size: 44px; font-weight: 900; letter-spacing: -.02em; color: var(--accent); line-height: 1.1; }
.tc-fig { width: 150px; margin: 6px auto 0; }
.tc-fig.wide { width: 100%; }
.tc-fig svg { width: 100%; height: auto; display: block; max-height: 180px; }
.tc-done { color: var(--ok); padding: 10px; font-weight: 700; }
.target-hint { text-align: center; margin: 0 0 6px; }
.target-tip { text-align: center; color: var(--warn); font-size: 14px; min-height: 1em; }
.target-chips, .trail { display: flex; flex-wrap: wrap; gap: 6px; justify-content: center; margin: 8px 0; }
.chip { display: inline-flex; align-items: center; padding: 5px 11px; border-radius: 999px; background: var(--card2); font-weight: 700; font-size: 13px; color: var(--muted); }
.chip.now { background: var(--accent); color: #12131a; }
.chip.done { color: var(--ok); }
.chip.ok { color: var(--ok); }
.chip.bad { color: var(--bad); }
.bar { height: 8px; border-radius: 4px; background: var(--card2); overflow: hidden; margin: 8px 0; }
.bar i { display: block; height: 100%; width: 0; background: var(--accent); border-radius: 4px; transition: width .15s; }
.bar.big { height: 14px; border-radius: 7px; }
.bar.hot i { background: var(--ok); }
.readout { display: flex; align-items: center; gap: 8px; padding: 9px 12px; border-radius: 12px; background: var(--bg2); border: 1px solid var(--line); margin: 10px 0; }
.readout .ic { color: var(--muted); }
.lvl { width: 60px; height: 6px; border-radius: 3px; background: var(--card2); overflow: hidden; }
.lvl i { display: block; height: 100%; width: 0; background: var(--muted); }
.lvl.hot i { background: var(--ok); }
.heard { font-weight: 800; margin-left: auto; }

.mic-gate { position: absolute; inset: 0; z-index: 6; border-radius: var(--r); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px; padding: 30px; text-align: center; background: rgba(13,15,21,.9); backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px); }
.step, #view { position: relative; }
.step { min-height: 380px; }
#view { min-height: calc(100vh - var(--top) - var(--bottom)); }
.gate-btn { width: 108px; height: 108px; border-radius: 50%; border: 0; background: var(--accent); color: #12131a; display: flex; align-items: center; justify-content: center; cursor: pointer; box-shadow: 0 0 0 0 var(--accent-mid); animation: pulse 1.8s infinite; }
@keyframes pulse { 70% { box-shadow: 0 0 0 26px transparent; } 100% { box-shadow: 0 0 0 0 transparent; } }
.gate-title { font-size: 20px; font-weight: 800; margin: 8px 0 0; }
.mic-gate .muted { max-width: 340px; }

/* tuner */
.tuner { text-align: center; padding: 10px 0; }
.tuner-dial { position: relative; height: 130px; margin: 0 auto 6px; max-width: 320px; overflow: hidden; }
.tuner-scale { position: absolute; inset: auto 0 6px 0; display: flex; justify-content: space-between; color: var(--muted); font-size: 22px; padding: 0 20px; }
.tuner-scale .mid { width: 4px; height: 26px; background: var(--ok); border-radius: 2px; align-self: flex-end; }
.tuner-dial::before { content: ''; position: absolute; left: 10%; right: 10%; top: 20px; height: 220px; border-radius: 50%; border: 2px dashed var(--line); }
.tuner-needle { position: absolute; left: 50%; bottom: 0; width: 4px; height: 118px; background: var(--muted); border-radius: 2px; transform-origin: 50% 100%; transform: translateX(-50%); transition: transform .12s ease, background .2s; }
.tuner-needle.ok { background: var(--ok); }
.tuner-note { font-size: 56px; font-weight: 900; line-height: 1; }
.tuner-cents { color: var(--muted); min-height: 22px; }
.tuner-strings { display: flex; justify-content: center; gap: 8px; margin: 16px 0; flex-wrap: wrap; }
.tchip { display: flex; flex-direction: column; align-items: center; width: 48px; padding: 8px 0; border-radius: 12px; background: var(--card); border: 2px solid var(--line); color: var(--text); font: inherit; cursor: pointer; }
.tchip small { color: var(--muted); font-size: 10px; }
.tchip.active { border-color: var(--accent); }
.tchip.done { border-color: var(--ok); background: #34d39922; }

/* play-along */
.playalong { display: flex; flex-direction: column; gap: 8px; }
.hw-hud { display: flex; justify-content: space-between; font-size: 13px; color: var(--muted); }
.hw-hud b { color: var(--text); font-size: 18px; }
.hw-wrap { position: relative; border-radius: var(--r); background: var(--bg2); border: 1px solid var(--line); overflow: hidden; }
.hw-canvas { display: block; width: 100%; height: 230px; touch-action: manipulation; }
.hw-canvas.sing { height: 270px; }
.hw-wrap.tall .pitch-canvas, .pitch-canvas { display: block; width: 100%; height: 300px; }
.hw-lyric { min-height: 24px; text-align: center; font-weight: 700; font-size: 16px; }
.hw-lyric.big { font-size: 20px; }
.hw-panel { display: flex; gap: 10px; justify-content: center; align-items: flex-start; min-height: 10px; }
.pn-chord { width: 120px; }
.pn-chord.next { width: 96px; opacity: .55; }

      .replace(/\*(.+?)\*/g, '<i>$1</i>')
      .replace(/`(.+?)`/g, '<code>$1</code>');
    if (/^[-•] /.test(line)) {
      if (!inList) { html += '<ul>'; inList = true; }
      html += '<li>' + line.slice(2) + '</li>';
    } else {
      if (inList) { html += '</ul>'; inList = false; }
      if (line) html += '<p>' + line + '</p>';
    }
  }
  if (inList) html += '</ul>';
  return html;
}

    g.gain.linearRampToValueAtTime(0, t + dur);
    const f = c.createBiquadFilter(); f.type = 'lowpass'; f.frequency.value = 2200;
    o.connect(f); f.connect(g); g.connect(out());
    o.start(t); lfo.start(t); o.stop(t + dur + 0.05); lfo.stop(t + dur + 0.05);
    track(o);
    return t + dur;
  }
  /** Metronome tick: high-pitched so the mic analysis (low-passed at 2.4 kHz) ignores it. */
  function tick(when, accent = false, gain = 0.5) {
    const c = ctx(); if (!c) return;
    const t = Math.max(when, c.currentTime);
    const len = Math.floor(c.sampleRate * 0.03);
    const key = 'tick' + (accent ? 1 : 0);
    let b = cache.get(key);
    if (!b) {
      b = c.createBuffer(1, len, c.sampleRate);
      const d = b.getChannelData(0);
      const f1 = accent ? 5200 : 4300;
      for (let i = 0; i < len; i++) {
        const env = Math.exp(-i / (c.sampleRate * 0.006));
        d[i] = env * (Math.sin(2 * Math.PI * f1 * i / c.sampleRate) * 0.8 + Math.sin(2 * Math.PI * f1 * 1.5 * i / c.sampleRate) * 0.3);
      }
      cache.set(key, b);
    }
    const s = c.createBufferSource(); s.buffer = b;
    const hp = c.createBiquadFilter(); hp.type = 'highpass'; hp.frequency.value = 3200;
    const g = c.createGain(); g.gain.value = accent ? gain * 1.2 : gain;
    s.connect(hp); hp.connect(g); g.connect(out());
    s.start(t);
    track(s);
  }
  function stopAll() {
    active.forEach(n => { try { n.stop(); } catch (e) { /* already stopped */ } });
    active.clear();
    // nothing is playing any more, so listen again right away (short tail for room echo)
    Engine.E.mutedUntil = Math.min(Engine.E.mutedUntil, Engine.now() + 0.12);
  }
  /** Play a note/chord for the user to hear, muting mic analysis meanwhile. */
  function preview(kind, midis, { arpeggio = false, dur = 1.6 } = {}) {
    const c = ctx(); if (!c) return 0;
    const t = c.currentTime + 0.03;
    let end;
    if (kind === 'voice') {
      end = t;
      midis.forEach((m, i) => { end = voice(m, t + i * dur, dur * 0.95); });
    } else if (arpeggio) {
      end = t;
      midis.forEach((m, i) => { end = Math.max(end, play(kind, m, t + i * 0.32, { gain: 0.7, dur: dur + (midis.length - i) * 0.32 })); });
    } else if (midis.length > 1 && kind !== 'piano') {
      end = strum(kind, midis, t, { gain: 0.6, dur });
    } else {
      end = t;
      midis.forEach(m => { end = Math.max(end, play(kind, m, t, { gain: midis.length > 1 ? 0.45 : 0.7, dur })); });
    }
    Engine.mute(end + 0.25);
    return end;
  }
  return { play, strum, voice, tick, stopAll, preview, buffer, get headphones() { return headphones; }, set headphones(v) { headphones = v; } };
})();

/* ---------------- Look-ahead scheduler ---------------- */
class Scheduler {
  constructor() { this.timer = 0; this.events = []; this.idx = 0; this.running = false; }
  /** events: [{time (ctx seconds), fn(time)}] sorted */
  start(events) {
    this.stop();
    this.events = events.slice().sort((a, b) => a.time - b.time);
    this.idx = 0; this.running = true;
    const pump = () => {
      if (!this.running) return;
      const horizon = Engine.now() + 0.15;
      while (this.idx < this.events.length && this.events[this.idx].time <= horizon) {
        const ev = this.events[this.idx++];
        try { ev.fn(ev.time); } catch (e) { console.error(e); }
      }
      if (this.idx < this.events.length) this.timer = setTimeout(pump, 30);
    };
    pump();
  }
  add(ev) { this.events.push(ev); this.events.sort((a, b) => a.time - b.time); }
  stop() { this.running = false; clearTimeout(this.timer); }
}

/* ---- diagrams.js ---- */
/* ==========================================================================
   Diagrams (SVG strings): chord boxes, piano keys, fretboard, staff.
   ========================================================================== */

function chordDiagram(instId, name, opts = {}) {
  const sh = opts.shape || shapeFor(instId, name);
  const n = instId === 'ukulele' ? 4 : 6;
  const W = 120, mx = n === 4 ? 26 : 16, top = opts.showName === false ? 22 : 40, fs = 22, nf = n === 4 ? 4 : 5;
  const sx = (W - 2 * mx) / (n - 1);
  const H = top + nf * fs + 18;
  const accent = opts.color || 'var(--accent)';
  if (!sh) return `<svg viewBox="0 0 ${W} ${H}" class="chord-svg"><text x="${W / 2}" y="${H / 2}" text-anchor="middle" class="cd-name">${esc(chordLabel(name))}</text><text x="${W / 2}" y="${H / 2 + 18}" text-anchor="middle" class="cd-fr">no shape</text></svg>`;
  let frets = sh.frets.slice(), fingers = (sh.fingers || []).slice();
  const lefty = opts.leftHanded ?? Settings.get('leftHanded');
  if (lefty) { frets.reverse(); fingers.reverse(); }
  const fretted = frets.filter(f => f > 0);
  const maxF = fretted.length ? Math.max(...fretted) : 0;
  const minF = fretted.length ? Math.min(...fretted) : 0;
  const base = maxF <= nf ? 1 : minF;
  const X = i => mx + i * sx;
  let s = `<svg viewBox="0 0 ${W} ${H}" class="chord-svg" role="img" aria-label="${esc(chordLabel(name))} chord diagram">`;
  if (opts.showName !== false) s += `<text x="${W / 2}" y="20" text-anchor="middle" class="cd-name">${esc(chordLabel(name))}</text>`;
  // nut / frets
  for (let f = 0; f <= nf; f++) {
    const y = top + f * fs;
    s += `<line x1="${X(0)}" y1="${y}" x2="${X(n - 1)}" y2="${y}" class="${f === 0 && base === 1 ? 'cd-nut' : 'cd-fret'}"/>`;
  }
  for (let i = 0; i < n; i++) s += `<line x1="${X(i)}" y1="${top}" x2="${X(i)}" y2="${top + nf * fs}" class="cd-string"/>`;
  if (base > 1) s += `<text x="${X(n - 1) + 6}" y="${top + fs * 0.65}" class="cd-fr">${base}fr</text>`;
  // barre (finger 1 on several strings at the lowest fret)
  const barreIdx = frets.map((f, i) => (fingers[i] === 1 && f === minF && f > 0) ? i : -1).filter(i => i >= 0);
  if (barreIdx.length >= 2) {
    const a = Math.min(...barreIdx), b = Math.max(...barreIdx);
    const y = top + (minF - base + 0.5) * fs;
    s += `<rect x="${X(a) - 8}" y="${y - 8}" width="${X(b) - X(a) + 16}" height="16" rx="8" fill="${accent}"/>`;
  }
  frets.forEach((f, i) => {
    const x = X(i);
    if (f < 0) s += `<text x="${x}" y="${top - 7}" text-anchor="middle" class="cd-x">×</text>`;
    else if (f === 0) s += `<circle cx="${x}" cy="${top - 11}" r="5" class="cd-open"/>`;
    else {
      const y = top + (f - base + 0.5) * fs;
      s += `<circle cx="${x}" cy="${y}" r="8.5" fill="${accent}"/>`;
      if (fingers[i]) s += `<text x="${x}" y="${y + 4}" text-anchor="middle" class="cd-finger">${fingers[i]}</text>`;
    }
  });
  // string names
  const names = INSTRUMENTS[instId].strings.slice();
  if (lefty) names.reverse();
  names.forEach((nm, i) => { s += `<text x="${X(i)}" y="${H - 3}" text-anchor="middle" class="cd-sname">${nm}</text>`; });
  return s + '</svg>';
}

/** Piano keyboard. marks: {midi: {color, label}} */
function keyboardSVG(lo, hi, marks = {}, opts = {}) {
  // expand to whole white keys
  const isBlack = m => [1, 3, 6, 8, 10].includes(mod12(m));
  while (isBlack(lo)) lo--;
  while (isBlack(hi)) hi++;
  const whites = [];
  for (let m = lo; m <= hi; m++) if (!isBlack(m)) whites.push(m);
  const ww = 24, wh = opts.height || 96, bw = 15, bh = wh * 0.62;
  const W = whites.length * ww;
  let s = `<svg viewBox="0 0 ${W + 2} ${wh + 2}" class="kb-svg" preserveAspectRatio="xMidYMid meet" role="img" aria-label="piano keys">`;
  const xOf = {};
  whites.forEach((m, i) => {
    xOf[m] = i * ww;
    const mk = marks[m];
    s += `<rect x="${i * ww + 1}" y="1" width="${ww - 1}" height="${wh}" rx="3" class="kb-white" ${mk ? `style="fill:${mk.color || 'var(--accent)'}"` : ''}/>`;
    if (mk && mk.label) s += `<text x="${i * ww + ww / 2 + 0.5}" y="${wh - 8}" text-anchor="middle" class="kb-label">${esc(mk.label)}</text>`;
    else if (mod12(m) === 0 && opts.labelC !== false) s += `<text x="${i * ww + ww / 2 + 0.5}" y="${wh - 8}" text-anchor="middle" class="kb-c">C${Math.floor(m / 12) - 1}</text>`;
  });
  for (let m = lo; m <= hi; m++) {
    if (!isBlack(m)) continue;
    const x = xOf[m - 1] + ww - bw / 2;
    const mk = marks[m];
    s += `<rect x="${x + 0.5}" y="1" width="${bw}" height="${bh}" rx="2.5" class="kb-black" ${mk ? `style="fill:${mk.color || 'var(--accent)'}"` : ''}/>`;
    if (mk && mk.label) s += `<text x="${x + bw / 2 + 0.5}" y="${bh - 6}" text-anchor="middle" class="kb-label kb-label-b">${esc(mk.label)}</text>`;
  }
  return s + '</svg>';
}

/** Horizontal fretboard. marks: [{s (0=lowest string), f, label, color, root}] */
function fretboardSVG(instId, marks = [], opts = {}) {
  const inst = INSTRUMENTS[instId];
  const n = inst.tuning.length;
  const from = opts.from ?? 0, to = opts.to ?? Math.max(5, ...marks.map(m => m.f + 1));
  const fw = 46, sh = 22, left = 26, topPad = 12;
  const W = left + (to - from + 1) * fw + 10, H = topPad + (n - 1) * sh + 26;
  const lefty = opts.leftHanded ?? Settings.get('leftHanded');
  const yOf = s => topPad + (n - 1 - s) * sh;  // highest string on top
  const xOf = f => left + (f - from) * fw + fw / 2;
  let s = `<svg viewBox="0 0 ${W} ${H}" class="fb-svg" role="img" aria-label="fretboard" ${lefty ? 'style="transform:scaleX(-1)"' : ''}>`;
  for (let f = from; f <= to; f++) {
    const x = left + (f - from) * fw;
    if ([3, 5, 7, 9, 15, 17].includes(f)) s += `<circle cx="${x + fw / 2}" cy="${topPad + (n - 1) * sh / 2}" r="4" class="fb-inlay"/>`;
    if (f === 12) { s += `<circle cx="${x + fw / 2}" cy="${topPad + sh * 0.5}" r="4" class="fb-inlay"/><circle cx="${x + fw / 2}" cy="${topPad + (n - 1.5) * sh}" r="4" class="fb-inlay"/>`; }
    s += `<line x1="${x + fw}" y1="${topPad}" x2="${x + fw}" y2="${topPad + (n - 1) * sh}" class="${f === 0 ? 'fb-nut' : 'fb-fret'}"/>`;
    if (f > 0) s += `<text x="${x + fw / 2}" y="${H - 4}" text-anchor="middle" class="fb-num" ${lefty ? `transform="scale(-1,1) translate(${-2 * (x + fw / 2)},0)"` : ''}>${f}</text>`;
  }
  for (let i = 0; i < n; i++) {
    s += `<line x1="${left}" y1="${yOf(i)}" x2="${W - 10}" y2="${yOf(i)}" class="fb-string" style="stroke-width:${1 + (n - i) * 0.25}"/>`;
    s += `<text x="10" y="${yOf(i) + 4}" text-anchor="middle" class="fb-sname" ${lefty ? `transform="scale(-1,1) translate(-20,0)"` : ''}>${inst.strings[i]}</text>`;
  }
  for (const m of marks) {
    if (m.f < from || m.f > to) continue;
    const x = xOf(m.f), y = yOf(m.s);
    s += `<circle cx="${x}" cy="${y}" r="9.5" fill="${m.color || (m.root ? 'var(--accent)' : 'var(--accent-soft)')}" ${m.root ? '' : 'stroke="var(--accent)" stroke-width="1.5"'}/>`;
    if (m.label) s += `<text x="${x}" y="${y + 3.5}" text-anchor="middle" class="fb-label" ${lefty ? `transform="scale(-1,1) translate(${-2 * x},0)"` : ''}>${esc(m.label)}</text>`;
  }
  return s + '</svg>';
}

/** Treble staff with note heads (for reading lessons). */
function staffSVG(midis, opts = {}) {
  const W = Math.max(160, 70 + midis.length * 44), H = 120, top = 30, ls = 10;
  const STEP = { 0: 0, 1: 0, 2: 1, 3: 1, 4: 2, 5: 3, 6: 3, 7: 4, 8: 4, 9: 5, 10: 5, 11: 6 };
  const pos = m => (Math.floor(m / 12) - 1) * 7 + STEP[mod12(m)];   // diatonic step
  const e4 = pos(64);                                                   // bottom line
  let s = `<svg viewBox="0 0 ${W} ${H}" class="staff-svg" role="img" aria-label="music staff">`;
  for (let i = 0; i < 5; i++) s += `<line x1="8" y1="${top + i * ls}" x2="${W - 8}" y2="${top + i * ls}" class="st-line"/>`;
  s += `<text x="12" y="${top + 4 * ls + 9}" class="st-clef">𝄞</text>`;
  midis.forEach((m, i) => {
    const x = 70 + i * 44;
    const p = pos(m) - e4;                 // 0 = E4 line, 1 = F4 space ...
    const y = top + 4 * ls - p * ls / 2;
    for (let l = -2; l >= p; l -= 2) s += `<line x1="${x - 12}" y1="${top + 4 * ls - l * ls / 2}" x2="${x + 12}" y2="${top + 4 * ls - l * ls / 2}" class="st-line"/>`;
    for (let l = 10; l <= p; l += 2) s += `<line x1="${x - 12}" y1="${top + 4 * ls - l * ls / 2}" x2="${x + 12}" y2="${top + 4 * ls - l * ls / 2}" class="st-line"/>`;
    if ([1, 3, 6, 8, 10].includes(mod12(m))) s += `<text x="${x - 20}" y="${y + 4}" class="st-acc">♯</text>`;
    s += `<ellipse cx="${x}" cy="${y}" rx="6.5" ry="4.8" transform="rotate(-20 ${x} ${y})" class="st-head ${opts.hl === i ? 'hl' : ''}"/>`;
    if (opts.labels) s += `<text x="${x}" y="${H - 6}" text-anchor="middle" class="st-lbl">${esc(noteLabel(m, false))}</text>`;
  });
  return s + '</svg>';
}

/** Small TAB line for a short phrase of positioned notes. */
function tabSVG(instId, notes, opts = {}) {
  const inst = INSTRUMENTS[instId];
  const n = inst.tuning.length, ls = 14, top = 12;
  const W = Math.max(150, 40 + notes.length * 34), H = top + (n - 1) * ls + 14;
  let s = `<svg viewBox="0 0 ${W} ${H}" class="tab-svg" role="img" aria-label="tablature">`;
  for (let i = 0; i < n; i++) {
    const y = top + (n - 1 - i) * ls;
    s += `<line x1="22" y1="${y}" x2="${W - 6}" y2="${y}" class="tb-line"/><text x="10" y="${y + 4}" text-anchor="middle" class="tb-s">${inst.strings[i]}</text>`;
  }
  notes.forEach((nt, i) => {
    if (nt.s === undefined) return;
    const x = 40 + i * 34, y = top + (n - 1 - nt.s) * ls;
    s += `<rect x="${x - 8}" y="${y - 7}" width="16" height="14" rx="3" class="tb-bg ${opts.hl === i ? 'hl' : ''}"/><text x="${x}" y="${y + 4.5}" text-anchor="middle" class="tb-f">${nt.f}</text>`;
  });
  return s + '</svg>';
}

function songChordNames(song, inst) {
  const key = (song.keys && song.keys[inst]) || song.key;
  const tr = mod12(parsePc(key) - parsePc(song.key) + 6) - 6;
  const names = [];
  parseChords(song.chords, song.sig).forEach(c => { if (c.name) { const n = tr ? transposeChord(c.name, tr, FLAT_KEYS.includes(key)) : c.name; if (!names.includes(n)) names.push(n); } });
  return names;
}

const Studio = {
  all() { return Store.get('songs', []); },
  get(id) { return this.all().find(s => s.id === id); },
  save(song) {
    song.updated = Date.now();
    Store.update('songs', list => { const i = list.findIndex(s => s.id === song.id); if (i >= 0) list[i] = song; else list.unshift(song); return list; }, []);
  },
  remove(id) { Store.update('songs', list => list.filter(s => s.id !== id), []); },
  create(t = {}) {
    const song = Object.assign({
      id: 's' + Date.now().toString(36) + Math.floor(Math.random() * 1e4).toString(36),
      title: 'Untitled song', instrument: Settings.get('instrument'), key: 'C', bpm: 84, sig: 4, strum: 'quarter',
      sections: [{ name: 'Verse', bars: ['C', 'G', 'Am', 'F'], lyrics: '' }], melody: '', created: Date.now(),
    }, JSON.parse(JSON.stringify(t)));
    if (song.instrument === 'voice' && !t.instrument) song.instrument = 'voice';
    this.save(song);
    return song;
  },
  /** Chord track string with lyric lines spread over each section's bars. */
  chordTrack(song) {
    const parts = [];
    for (const sec of song.sections) {
      const lines = (sec.lyrics || '').split('\n').map(x => x.trim()).filter(Boolean);
      const n = sec.bars.length;
      const starts = {};
      lines.forEach((line, i) => { starts[Math.floor(i * n / lines.length)] = line; });
      sec.bars.forEach((c, i) => {
        const lyric = starts[i] ? `"${starts[i].replace(/"/g, '')}"` : '';

  exportCode(song) { return 'TONIC1:' + btoa(unescape(encodeURIComponent(JSON.stringify(song)))); },
  importCode(code) {
    const m = /TONIC1:([A-Za-z0-9+/=]+)/.exec(code.trim());
    if (!m) throw new Error('Not a song code');
    const s = JSON.parse(decodeURIComponent(escape(atob(m[1]))));
    if (!s.sections) throw new Error('Not a song code');
    s.id = 's' + Date.now().toString(36);
    this.save(s);
    return s;
  },

/** Turn a pitch track into notes on an eighth-note grid. */
function quantizeMelody(frames, totalBeats) {
  const segs = [];
  let cur = null;
  for (const f of frames) {
    const r = f.midi === null ? null : Math.round(f.midi);
    if (cur && r !== null && Math.abs(r - cur.m) <= 0 && f.beat - cur.end < 0.15) { cur.end = f.beat; cur.vals.push(f.midi); continue; }
    if (cur && r !== null && Math.abs(f.midi - median(cur.vals)) < 0.6 && f.beat - cur.end < 0.15) { cur.end = f.beat; cur.vals.push(f.midi); continue; }
    if (cur) segs.push(cur);
    cur = r === null ? null : { m: r, start: f.beat, end: f.beat, vals: [f.midi] };
  }
  if (cur) segs.push(cur);
  const notesQ = segs.filter(s => s.end - s.start >= 0.18).map(s => ({ m: Math.round(median(s.vals)), a: Math.round(s.start * 2) / 2, b: Math.max(Math.round(s.start * 2) / 2 + 0.5, Math.round(s.end * 2) / 2) }));
  // merge equal neighbours that touch, resolve overlaps
  const out = [];
  for (const n of notesQ) {
    const p = out[out.length - 1];
    if (p && n.a < p.b) n.a = p.b;
    if (n.b <= n.a) continue;
    if (p && p.m === n.m && n.a - p.b <= 0) { p.b = n.b; continue; }
    out.push(n);
  }
  if (!out.length) return '';
  let t = 0;
  const toks = [];
  for (const n of out) {
    if (n.a > t) toks.push('r:' + (n.a - t));
    toks.push(noteName(n.m) + ':' + (n.b - n.a));
    t = n.b;
  }
  if (t < totalBeats) toks.push('r:' + (totalBeats - t));
  return toks.join(' ');
}

const Progress = {
  all() { return Store.get('progress', {}); },
  get(id) { return this.all()[id] || null; },
  record(lesson, score) {
    const stars = scoreToStars(score);
    const prog = this.all();
    const prev = prog[lesson.id];
    let xp = 0;
    if (!prev || !prev.done) xp = stars >= 1 ? 10 + stars * 10 : 2;
    else if (stars > prev.stars) xp = (stars - prev.stars) * 10;
    prog[lesson.id] = { stars: Math.max(stars, prev ? prev.stars : 0), best: Math.max(score, prev ? prev.best : 0), done: !!(prev && prev.done) || stars >= 1, at: Date.now() };
    Store.set('progress', prog);
    if (xp) Store.update('xp', x => x + xp, 0);
    this.touchStreak();
    return { stars, xp };
  },
  touchStreak() {
    const today = new Date().toDateString();
    const st = Store.get('streak', { last: null, count: 0 });
    if (st.last === today) return;
    const yesterday = new Date(Date.now() - 864e5).toDateString();
    st.count = st.last === yesterday ? st.count + 1 : 1;
    st.last = today;
    Store.set('streak', st);
  },
  streak() {
    const st = Store.get('streak', { last: null, count: 0 });

  },
  list(inst) { return COURSES[inst].flatMap(c => c.lessons); },
  unlocked(lesson) {

    const list = this.list(lesson.inst);
    const i = list.indexOf(lesson);
    if (i <= 0 || this.get(lesson.id)) return true;
    const p = this.get(list[i - 1].id);

  },
  next(inst) { const list = this.list(inst); return list.find(l => !(this.get(l.id) || {}).done) || null; },

**Tips for accurate detection:**

- Use **wired** headphones for backing music; Bluetooth adds a delay.
