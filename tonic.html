:root {
  --bg: #0d0f15; --bg2: #12151d; --card: #181c26; --card2: #1f2431; --line: #2a3040; --text: #eef0f6; --muted: #98a0b3;
  --accent: #ff9f43; --accent-soft: #ff9f4333; --accent-mid: #ff9f4366; --ok: #34d399; --bad: #f87171; --warn: #fbbf24;
  --r: 16px; --r-sm: 11px; --shadow: 0 8px 28px rgba(0,0,0,.35);
  --top: calc(56px + env(safe-area-inset-top)); --bottom: calc(62px + env(safe-area-inset-bottom));
  color-scheme: dark;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; background: var(--bg); color: var(--text); font: 15px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; }
body { min-height: 100vh; padding: var(--top) 0 var(--bottom); overscroll-behavior-y: none; }
body.fullscreen { padding-bottom: env(safe-area-inset-bottom); }
body.fullscreen .tabbar { display: none; }
a { color: inherit; text-decoration: none; }
h1 { font-size: 26px; line-height: 1.15; margin: 0 0 4px; letter-spacing: -.02em; }
h2 { font-size: 20px; margin: 0 0 6px; letter-spacing: -.01em; }
h3 { font-size: 16px; margin: 0 0 8px; }
p { margin: 0 0 10px; }
.muted { color: var(--muted); }
.small { font-size: 13px; }
.center { text-align: center; justify-content: center; }
.row { display: flex; align-items: center; }
.row.gap { gap: 10px; }
.row.wrap { flex-wrap: wrap; }
.row.between { justify-content: space-between; }
.col { display: flex; flex-direction: column; gap: 8px; }
.ic { display: inline-flex; align-items: center; justify-content: center; flex: none; }
.ic svg { display: block; }
#view { max-width: 680px; margin: 0 auto; padding: 16px 16px 40px; }
code { background: var(--card2); padding: 1px 6px; border-radius: 6px; font-size: .92em; }

/* buttons & fields */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 44px; padding: 0 18px; border-radius: 999px; border: 1px solid transparent; font: 600 15px/1 system-ui, sans-serif; color: var(--text); background: var(--card2); cursor: pointer; transition: transform .08s ease, background .2s, opacity .2s; touch-action: manipulation; }
.btn:active { transform: scale(.97); }
.btn:disabled { opacity: .4; pointer-events: none; }
.btn.primary { background: var(--accent); color: #12131a; }
.btn.ghost { background: transparent; border-color: var(--line); }
.btn.danger { background: var(--bad); color: #160b0b; }
.btn.sm { min-height: 36px; padding: 0 13px; font-size: 14px; }
.btn.wide { width: 100%; }
.btn.round { width: 64px; height: 64px; padding: 0; border-radius: 50%; }
.btn.round.big { width: 92px; height: 92px; }
.btn.toggle.on { background: var(--accent-soft); border-color: var(--accent); color: var(--accent); }
.icon-btn { display: inline-flex; align-items: center; justify-content: center; width: 42px; height: 42px; border-radius: 50%; background: transparent; border: 0; color: var(--text); cursor: pointer; }
.danger-text { color: var(--bad) !important; }
.field { width: 100%; background: var(--bg2); color: var(--text); border: 1px solid var(--line); border-radius: var(--r-sm); padding: 11px 12px; font: inherit; }
.field:focus { outline: 2px solid var(--accent-mid); border-color: var(--accent); }
textarea.field { resize: vertical; min-height: 70px; }
select.field { appearance: none; background-image: linear-gradient(45deg, transparent 50%, var(--muted) 50%), linear-gradient(135deg, var(--muted) 50%, transparent 50%); background-position: calc(100% - 18px) 50%, calc(100% - 13px) 50%; background-size: 5px 5px; background-repeat: no-repeat; padding-right: 30px; }
input[type=range] { width: 100%; accent-color: var(--accent); }
.slider { display: grid; grid-template-columns: auto 1fr auto; gap: 10px; align-items: center; margin-top: 10px; }

/* top bar & tabs */
.topbar { position: fixed; inset: 0 0 auto 0; z-index: 30; display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; height: var(--top); padding: env(safe-area-inset-top) 10px 0; background: rgba(13,15,21,.86); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px); border-bottom: 1px solid rgba(255,255,255,.05); }
.tb-left { display: flex; align-items: center; }
.tb-title { font-weight: 700; font-size: 15px; text-align: center; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 38vw; }
.brand { display: flex; align-items: center; gap: 9px; font-weight: 800; font-size: 18px; letter-spacing: -.02em; padding-left: 4px; }
.logo { display: inline-flex; align-items: center; justify-content: center; width: 30px; height: 30px; border-radius: 9px; font-weight: 900; color: #10121a; background: conic-gradient(from 210deg, #ff9f43, #fb7185, #a78bfa, #2dd4bf, #ff9f43); }
.mic-pill { justify-self: end; display: inline-flex; align-items: center; gap: 6px; height: 36px; padding: 0 12px 0 10px; border-radius: 999px; border: 1px solid var(--line); background: var(--card); color: var(--muted); font: 600 13px system-ui, sans-serif; cursor: pointer; }
.mp-dot { width: 9px; height: 9px; border-radius: 50%; background: var(--muted); transition: transform .08s; }
.mic-pill[data-state=on] { color: var(--text); border-color: var(--accent); }
.mic-pill[data-state=on] .mp-dot { background: var(--accent); }
.mic-pill[data-state=on] .mp-dot.hot { background: var(--ok); }
.mic-pill[data-state=blocked], .mic-pill[data-state=error] { color: var(--bad); border-color: #f8717166; }
.mic-pill[data-state=blocked] .mp-dot, .mic-pill[data-state=error] .mp-dot { background: var(--bad); }
.tabbar { position: fixed; inset: auto 0 0 0; z-index: 30; display: flex; justify-content: space-around; height: var(--bottom); padding-bottom: env(safe-area-inset-bottom); background: rgba(13,15,21,.92); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px); border-top: 1px solid rgba(255,255,255,.06); }
.tab { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; font-size: 11px; font-weight: 600; color: var(--muted); }
.tab.on { color: var(--accent); }

/* learn */
.hero { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; margin: 4px 0 14px; }
.stats { display: flex; gap: 8px; }
.stat { display: inline-flex; align-items: center; gap: 4px; padding: 6px 10px; border-radius: 999px; background: var(--card); font-weight: 700; }
.stat .ic { color: var(--accent); }
.inst-switch { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin: 0 0 14px; }
.inst { --c: var(--accent); display: flex; flex-direction: column; align-items: center; gap: 3px; padding: 12px 4px 10px; border-radius: var(--r); border: 1px solid var(--line); background: var(--card); color: var(--muted); cursor: pointer; font: inherit; }
.inst b { color: var(--text); font-size: 13px; }
.inst small { font-size: 11px; }
.inst .ic { color: var(--c); }
.inst.on { border-color: var(--c); background: linear-gradient(180deg, color-mix(in srgb, var(--c) 18%, var(--card)), var(--card)); }
.continue-card { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 18px; border-radius: var(--r); background: linear-gradient(135deg, var(--accent-mid), var(--card) 70%); border: 1px solid var(--accent-mid); margin-bottom: 18px; box-shadow: var(--shadow); }
.continue-card small { color: var(--accent); font-weight: 700; text-transform: uppercase; letter-spacing: .06em; font-size: 11px; }
.continue-card h2 { margin: 4px 0 2px; }
.continue-card.done { background: var(--card); }
.play-circle { display: flex; align-items: center; justify-content: center; width: 58px; height: 58px; border-radius: 50%; background: var(--accent); color: #12131a; flex: none; }
.chapters { display: flex; flex-direction: column; gap: 10px; }
.chapter { border-radius: var(--r); background: var(--card); border: 1px solid var(--line); overflow: hidden; }
.ch-head { width: 100%; display: flex; align-items: center; gap: 12px; padding: 14px; background: none; border: 0; color: inherit; text-align: left; font: inherit; cursor: pointer; }
.ch-num { display: flex; align-items: center; justify-content: center; width: 34px; height: 34px; border-radius: 10px; background: var(--card2); font-weight: 800; color: var(--accent); flex: none; }
.ch-main { flex: 1; display: flex; flex-direction: column; min-width: 0; }
.ch-main b { font-size: 16px; }
.ch-main small { font-size: 12.5px; line-height: 1.35; }
.ch-level { font-size: 10.5px; font-weight: 800; letter-spacing: .08em; text-transform: uppercase; color: var(--accent); }
.ch-prog { display: flex; flex-direction: column; align-items: center; gap: 1px; flex: none; }
.ch-prog small { font-size: 10.5px; color: var(--muted); }
.ring-bg { fill: none; stroke: var(--card2); stroke-width: 4; }
.ring-fg { fill: none; stroke: var(--accent); stroke-width: 4; stroke-linecap: round; transition: stroke-dashoffset .5s; }
.lessons { display: none; padding: 0 10px 10px; }
.chapter.open .lessons { display: block; }
.lesson-row { display: flex; align-items: center; gap: 12px; padding: 11px 8px; border-radius: 12px; }
.lesson-row:hover, .lesson-row:active { background: var(--card2); }
.lesson-row.next { background: var(--accent-soft); }
.lesson-row.locked { opacity: .45; }
.lr-num { display: flex; align-items: center; justify-content: center; width: 28px; height: 28px; border-radius: 50%; border: 2px solid var(--line); font-size: 12px; font-weight: 800; flex: none; color: var(--muted); }
.lesson-row.next .lr-num { border-color: var(--accent); color: var(--accent); }
.lr-title { flex: 1; font-weight: 600; }
.lr-types { font-size: 11.5px; }
.stars { display: inline-flex; gap: 1px; }
.stars .on { color: #fcd34d; }
.stars .off { color: var(--line); }
.card { background: var(--card); border: 1px solid var(--line); border-radius: var(--r); padding: 16px; margin-bottom: 12px; }
.welcome { background: linear-gradient(160deg, #20263a, var(--card)); }
.ticks { padding-left: 0; list-style: none; margin: 0 0 14px; }
.ticks li { padding-left: 24px; position: relative; margin-bottom: 4px; }
.ticks li::before { content: '✓'; position: absolute; left: 4px; color: var(--ok); font-weight: 800; }

/* lesson */
.lesson { display: flex; flex-direction: column; min-height: calc(100vh - var(--top) - 30px); }
.lesson-head h1 { font-size: 22px; }
.lesson-prog { display: flex; gap: 5px; margin: 10px 0 16px; }
.lesson-prog i { flex: 1; height: 5px; border-radius: 3px; background: var(--card2); }
.lesson-prog i.done { background: var(--accent); }
.lesson-prog i.now { background: var(--accent-mid); }
.lesson-body { flex: 1; }
.lesson-foot { position: sticky; bottom: 0; display: flex; gap: 10px; align-items: center; padding: 12px 0 calc(8px + env(safe-area-inset-bottom)); background: linear-gradient(transparent, var(--bg) 30%); margin-top: 16px; }
.lesson-foot .btn.wide { flex: 1; }
.lesson-done { text-align: center; padding: 30px 0 10px; position: relative; overflow: hidden; }
.lesson-done h2 { font-size: 26px; margin-top: 10px; }
.confetti i { position: absolute; top: -20px; width: 8px; height: 14px; border-radius: 2px; background: var(--accent); animation: fall 1.6s ease-in forwards; opacity: .9; }
.confetti i:nth-child(3n) { background: #fcd34d; }
.confetti i:nth-child(3n+1) { background: var(--ok); width: 6px; }
@keyframes fall { to { transform: translateY(240px) rotate(540deg); opacity: 0; } }

/* steps */
.step-title { margin-bottom: 10px; }
.prose p { margin: 0 0 12px; }
.prose ul { margin: 0 0 12px; padding-left: 20px; }
.prose li { margin-bottom: 6px; }
.prose b { color: #fff; }
.figs { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; margin: 14px 0; }
.fig { background: var(--card); border: 1px solid var(--line); border-radius: var(--r); padding: 8px; color: inherit; font: inherit; }
.fig.chord-fig { width: 116px; cursor: pointer; }
.fig.big { width: 200px; margin: 0 auto; display: block; }
.fig.wide { width: 100%; overflow-x: auto; }
.fig.wide svg { width: 100%; height: auto; max-height: 190px; display: block; margin: 0 auto; }
.fig.piano-fig { width: 170px; }
.fig-cap { text-align: center; font-weight: 800; margin-bottom: 4px; }
.listen-row { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; margin: 8px 0; }
.quiz-q { font-size: 18px; font-weight: 700; }
.quiz-opts { display: flex; flex-direction: column; gap: 9px; margin: 12px 0; }
.quiz-opt { text-align: left; padding: 14px 16px; border-radius: var(--r-sm); border: 1px solid var(--line); background: var(--card); color: var(--text); font: 600 15px system-ui, sans-serif; cursor: pointer; }
.quiz-opt.right { border-color: var(--ok); background: #34d39922; }
.quiz-opt.wrong { border-color: var(--bad); background: #f8717122; }
.quiz-explain { padding: 12px 14px; border-radius: var(--r-sm); background: var(--card2); }
.quiz-explain.ok b { color: var(--ok); }
.quiz-explain.no b { color: var(--warn); }
.step-hint { color: var(--muted); }

.target-card { position: relative; text-align: center; padding: 18px 14px; border-radius: var(--r); background: var(--card); border: 1px solid var(--line); margin: 10px 0; }
.target-card.flash { animation: flash .5s ease; }
@keyframes flash { 0% { box-shadow: 0 0 0 0 #34d399aa; border-color: var(--ok); } 100% { box-shadow: 0 0 0 18px #34d39900; } }
.tc-name { font-size: 44px; font-weight: 900; letter-spacing: -.02em; color: var(--accent); line-height: 1.1; }
.tc-fig { width: 150px; margin: 6px auto 0; }
.tc-fig.wide { width: 100%; }
.tc-fig svg { width: 100%; height: auto; display: block; max-height: 180px; }
.tc-done { color: var(--ok); padding: 10px; font-weight: 700; }
.target-hint { text-align: center; margin: 0 0 6px; }
.target-tip { text-align: center; color: var(--warn); font-size: 14px; min-height: 1em; }
.target-chips, .trail { display: flex; flex-wrap: wrap; gap: 6px; justify-content: center; margin: 8px 0; }
.chip { display: inline-flex; align-items: center; padding: 5px 11px; border-radius: 999px; background: var(--card2); font-weight: 700; font-size: 13px; color: var(--muted); }
.chip.now { background: var(--accent); color: #12131a; }
.chip.done { color: var(--ok); }
.chip.ok { color: var(--ok); }
.chip.bad { color: var(--bad); }
.bar { height: 8px; border-radius: 4px; background: var(--card2); overflow: hidden; margin: 8px 0; }
.bar i { display: block; height: 100%; width: 0; background: var(--accent); border-radius: 4px; transition: width .15s; }
.bar.big { height: 14px; border-radius: 7px; }
.bar.hot i { background: var(--ok); }
.readout { display: flex; align-items: center; gap: 8px; padding: 9px 12px; border-radius: 12px; background: var(--bg2); border: 1px solid var(--line); margin: 10px 0; }
.readout .ic { color: var(--muted); }
.lvl { width: 60px; height: 6px; border-radius: 3px; background: var(--card2); overflow: hidden; }
.lvl i { display: block; height: 100%; width: 0; background: var(--muted); }
.lvl.hot i { background: var(--ok); }
.heard { font-weight: 800; margin-left: auto; }

.mic-gate { position: absolute; inset: 0; z-index: 6; border-radius: var(--r); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px; padding: 30px; text-align: center; background: rgba(13,15,21,.9); backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px); }
.step, #view { position: relative; }
.step { min-height: 380px; }
#view { min-height: calc(100vh - var(--top) - var(--bottom)); }
.gate-btn { width: 108px; height: 108px; border-radius: 50%; border: 0; background: var(--accent); color: #12131a; display: flex; align-items: center; justify-content: center; cursor: pointer; box-shadow: 0 0 0 0 var(--accent-mid); animation: pulse 1.8s infinite; }
@keyframes pulse { 70% { box-shadow: 0 0 0 26px transparent; } 100% { box-shadow: 0 0 0 0 transparent; } }
.gate-title { font-size: 20px; font-weight: 800; margin: 8px 0 0; }
.mic-gate .muted { max-width: 340px; }

/* tuner */
.tuner { text-align: center; padding: 10px 0; }
.tuner-dial { position: relative; height: 130px; margin: 0 auto 6px; max-width: 320px; overflow: hidden; }
.tuner-scale { position: absolute; inset: auto 0 6px 0; display: flex; justify-content: space-between; color: var(--muted); font-size: 22px; padding: 0 20px; }
.tuner-scale .mid { width: 4px; height: 26px; background: var(--ok); border-radius: 2px; align-self: flex-end; }
.tuner-dial::before { content: ''; position: absolute; left: 10%; right: 10%; top: 20px; height: 220px; border-radius: 50%; border: 2px dashed var(--line); }
.tuner-needle { position: absolute; left: 50%; bottom: 0; width: 4px; height: 118px; background: var(--muted); border-radius: 2px; transform-origin: 50% 100%; transform: translateX(-50%); transition: transform .12s ease, background .2s; }
.tuner-needle.ok { background: var(--ok); }
.tuner-note { font-size: 56px; font-weight: 900; line-height: 1; }
.tuner-cents { color: var(--muted); min-height: 22px; }
.tuner-strings { display: flex; justify-content: center; gap: 8px; margin: 16px 0; flex-wrap: wrap; }
.tchip { display: flex; flex-direction: column; align-items: center; width: 48px; padding: 8px 0; border-radius: 12px; background: var(--card); border: 2px solid var(--line); color: var(--text); font: inherit; cursor: pointer; }
.tchip small { color: var(--muted); font-size: 10px; }
.tchip.active { border-color: var(--accent); }
.tchip.done { border-color: var(--ok); background: #34d39922; }

/* play-along */
.playalong { display: flex; flex-direction: column; gap: 8px; }
.hw-hud { display: flex; justify-content: space-between; font-size: 13px; color: var(--muted); }
.hw-hud b { color: var(--text); font-size: 18px; }
.hw-wrap { position: relative; border-radius: var(--r); background: var(--bg2); border: 1px solid var(--line); overflow: hidden; }
.hw-canvas { display: block; width: 100%; height: 230px; touch-action: manipulation; }
.hw-canvas.sing { height: 270px; }
.hw-wrap.tall .pitch-canvas, .pitch-canvas { display: block; width: 100%; height: 300px; }
.hw-lyric { min-height: 24px; text-align: center; font-weight: 700; font-size: 16px; }
.hw-lyric.big { font-size: 20px; }
.hw-panel { display: flex; gap: 10px; justify-content: center; align-items: flex-start; min-height: 10px; }
.pn-chord { width: 120px; }
.pn-chord.next { width: 96px; opacity: .55; }
.pn-chord svg, .pn-kb svg { width: 100%; height: auto; display: block; }
.pn-cur { flex: 1; text-align: center; }
.pn-name { font-weight: 900; font-size: 22px; color: var(--accent); }
.pn-kb { max-width: 340px; margin: 0 auto; }
.pn-kb.wide { max-width: 100%; width: 100%; }
.pn-next { display: flex; flex-direction: column; align-items: center; color: var(--muted); padding-top: 10px; }
.pn-next b { font-size: 18px; color: var(--text); }
.hw-controls { display: flex; align-items: center; gap: 14px; justify-content: center; padding: 6px 0; }
.tempo { display: flex; align-items: center; gap: 6px; }
.bpm { min-width: 66px; text-align: center; font-weight: 700; }
.results { text-align: center; padding: 18px; border-radius: var(--r); background: var(--card); border: 1px solid var(--accent-mid); margin: 12px 0; animation: pop .35s ease; }
@keyframes pop { from { transform: scale(.94); opacity: 0; } }
.res-score { font-size: 40px; font-weight: 900; }
.res-counts { display: flex; gap: 6px; flex-wrap: wrap; justify-content: center; margin-bottom: 12px; }
.cmeter { display: flex; align-items: center; gap: 8px; font-size: 12px; color: var(--muted); margin: 10px 0; }
.cm-track { position: relative; flex: 1; height: 26px; border-radius: 13px; background: var(--card2); }
.cm-track b { position: absolute; left: 32.5%; width: 35%; top: 0; bottom: 0; background: #34d39922; border-left: 1px solid #34d39955; border-right: 1px solid #34d39955; }
.cm-track i { position: absolute; top: 3px; left: 50%; width: 20px; height: 20px; margin-left: -10px; border-radius: 50%; background: var(--muted); transition: left .08s; opacity: .25; }
.cm-track i.ok { background: var(--ok); }
.range-res { display: flex; justify-content: space-around; margin-top: 10px; }

/* overlay */
.overlay { position: fixed; inset: 0; z-index: 50; background: var(--bg); display: flex; flex-direction: column; padding-top: env(safe-area-inset-top); }
.ov-head { display: flex; align-items: center; gap: 8px; padding: 8px 10px; border-bottom: 1px solid var(--line); }
.ov-body { position: relative; flex: 1; overflow-y: auto; padding: 14px 16px calc(20px + env(safe-area-inset-bottom)); max-width: 900px; width: 100%; margin: 0 auto; }

/* lists */
.screen-head { margin: 4px 0 14px; }
.list { display: flex; flex-direction: column; gap: 8px; }
.list-item { display: flex; align-items: center; gap: 12px; width: 100%; padding: 13px 14px; border-radius: var(--r-sm); background: var(--card); border: 1px solid var(--line); color: var(--text); font: inherit; text-align: left; cursor: pointer; }
.card .list-item { background: transparent; border: 0; border-bottom: 1px solid var(--line); border-radius: 0; padding: 13px 2px; }
.card .list-item:last-child { border-bottom: 0; }
.li-icon { flex: none; display: flex; align-items: center; justify-content: center; width: 40px; height: 40px; border-radius: 12px; background: var(--card2); }
.li-icon.level { color: var(--accent); font-size: 8px; letter-spacing: 1px; }
.li-main { flex: 1; display: flex; flex-direction: column; min-width: 0; }
.li-main small { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.badge { font-size: 10.5px; font-weight: 800; padding: 3px 8px; border-radius: 999px; background: var(--accent-soft); color: var(--accent); }
.empty { text-align: center; color: var(--muted); padding: 40px 10px; }
.modes { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; margin: 6px 0 18px; }
.mode-card { display: flex; flex-direction: column; align-items: flex-start; gap: 5px; padding: 16px; border-radius: var(--r); background: linear-gradient(150deg, var(--accent-soft), var(--card) 70%); border: 1px solid var(--accent-mid); color: var(--text); font: inherit; text-align: left; cursor: pointer; }
.mode-card .ic { color: var(--accent); }
.section-title { margin: 20px 0 10px; }
.lyrics-view { white-space: pre-wrap; color: var(--muted); }

/* tools */
.tool-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; }
.tool { display: flex; flex-direction: column; gap: 6px; padding: 16px; border-radius: var(--r); background: var(--card); border: 1px solid var(--line); min-height: 132px; }
.tool .ic { color: var(--accent); }
.seg { display: flex; gap: 4px; padding: 4px; border-radius: 999px; background: var(--card); border: 1px solid var(--line); margin: 0 0 12px; }
.seg button { flex: 1; min-height: 34px; border-radius: 999px; border: 0; background: transparent; color: var(--muted); font: 600 13.5px system-ui, sans-serif; cursor: pointer; }
.seg button.on { background: var(--accent); color: #12131a; }
.metronome { display: flex; flex-direction: column; align-items: center; gap: 14px; padding: 10px 0; }
.met-bpm { font-size: 72px; font-weight: 900; line-height: 1; }
.met-dots { display: flex; gap: 12px; }
.met-dots i { width: 18px; height: 18px; border-radius: 50%; background: var(--card2); transition: background .05s; }
.met-dots i.acc { border: 2px solid var(--accent-mid); }
.met-dots i.on { background: var(--accent); }
.chip-row { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 10px; }
.pick { min-width: 44px; min-height: 36px; padding: 0 10px; border-radius: 10px; border: 1px solid var(--line); background: var(--card); color: var(--text); font: 700 14px system-ui, sans-serif; cursor: pointer; }
.pick.on { background: var(--accent); color: #12131a; border-color: var(--accent); }
.chordlib-out { margin-top: 10px; }
.check-status { text-align: center; margin: 10px 0; min-height: 24px; font-weight: 700; color: var(--muted); }
.check-status.ok { color: var(--ok); }
.detector { text-align: center; padding: 20px 0 6px; }
.det-big { font-size: 64px; font-weight: 900; color: var(--accent); text-align: center; line-height: 1.1; }
.det-sub { text-align: center; }

/* studio */
.title-field { font-size: 20px; font-weight: 800; margin-bottom: 10px; }
.grid2 { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; }
.grid2 label, .slider { color: var(--muted); }
.grid2 small { display: block; margin-bottom: 4px; }
.card-head { display: flex; justify-content: space-between; align-items: center; }
.palette { display: flex; flex-wrap: wrap; gap: 7px; }
.pal-chip { display: flex; flex-direction: column; align-items: center; min-width: 56px; padding: 8px 10px; border-radius: 12px; border: 1px solid var(--accent-mid); background: var(--accent-soft); color: var(--text); font: inherit; cursor: pointer; }
.pal-chip small { color: var(--muted); font-size: 11px; }
.pal-chip.alt { background: var(--card2); border-color: var(--line); }
.bars { display: grid; grid-template-columns: repeat(4, 1fr); gap: 7px; margin: 10px 0; }
.bar-chip { position: relative; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 58px; border-radius: 12px; border: 1px solid var(--line); background: var(--bg2); color: var(--text); font: inherit; cursor: pointer; }
.bar-chip small { position: absolute; top: 4px; left: 7px; font-size: 10px; color: var(--muted); }
.bar-chip b { font-size: 18px; }
.bar-chip.sel { border-color: var(--accent); box-shadow: 0 0 0 2px var(--accent-mid); }
.bar-chip.add { border-style: dashed; color: var(--muted); }
.sec-name { font-weight: 800; background: transparent; border-color: transparent; padding: 4px 0; font-size: 16px; }
.lyrics { margin-top: 10px; }
.studio-actions { position: sticky; bottom: calc(var(--bottom) + 8px); display: flex; gap: 10px; justify-content: center; padding: 10px; border-radius: 999px; background: rgba(24,28,38,.92); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); border: 1px solid var(--line); margin: 14px 0; z-index: 5; }
.rec-overlay { position: fixed; inset: 0; z-index: 60; background: rgba(13,15,21,.96); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px; padding: 30px; text-align: center; }
.rec-overlay .bar { width: 80%; max-width: 360px; }
.rec-dot { width: 22px; height: 22px; border-radius: 50%; background: var(--bad); animation: blink 1s infinite; }
@keyframes blink { 50% { opacity: .3; } }
.rec-note { font-size: 48px; font-weight: 900; color: var(--accent); margin: 0; }

/* me */
.stat-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin-bottom: 12px; }
.stat-card { display: flex; flex-direction: column; align-items: center; padding: 12px 4px; border-radius: var(--r); background: var(--card); border: 1px solid var(--line); }
.stat-card .ic { color: var(--accent); }
.stat-card b { font-size: 22px; }
.stat-card small { color: var(--muted); font-size: 11.5px; }
.inst-prog { display: flex; align-items: center; gap: 12px; padding: 8px 0; }
.ip-main { flex: 1; }
.ip-main .bar { margin: 4px 0 0; }
.toggle-row { display: flex; align-items: center; justify-content: space-between; gap: 14px; padding: 12px 0; border-bottom: 1px solid var(--line); cursor: pointer; }
.toggle-row:last-child { border-bottom: 0; }
.toggle-row > span:first-child { display: flex; flex-direction: column; }
.toggle-row .seg { margin: 0; flex: none; }
.switch { position: relative; flex: none; width: 50px; height: 30px; }
.switch input { position: absolute; opacity: 0; inset: 0; margin: 0; cursor: pointer; z-index: 1; }
.switch i { position: absolute; inset: 0; border-radius: 15px; background: var(--card2); border: 1px solid var(--line); transition: background .2s; }
.switch i::after { content: ''; position: absolute; top: 3px; left: 3px; width: 22px; height: 22px; border-radius: 50%; background: #c9cfdc; transition: transform .2s; }
.switch input:checked + i { background: var(--accent); }
.switch input:checked + i::after { transform: translateX(20px); background: #fff; }
.about { margin-top: 18px; }
.status-box { padding: 14px; border-radius: var(--r-sm); margin-bottom: 12px; font-weight: 600; }
.status-box.ok { background: #34d39922; border: 1px solid #34d39966; }
.status-box.bad { background: #f8717122; border: 1px solid #f8717166; }
.status-box.info { background: var(--accent-soft); border: 1px solid var(--accent-mid); }

/* dialogs & toast */
.dialog-wrap { position: fixed; inset: 0; z-index: 80; display: flex; align-items: center; justify-content: center; padding: 20px; background: rgba(0,0,0,.6); opacity: 0; transition: opacity .18s; }
.dialog-wrap.show { opacity: 1; }
.dialog { width: 100%; max-width: 420px; background: var(--card); border: 1px solid var(--line); border-radius: 20px; padding: 20px; box-shadow: var(--shadow); }
.dialog .field { margin: 8px 0 4px; font-family: ui-monospace, monospace; font-size: 12px; }
.dialog-actions { display: flex; gap: 10px; justify-content: flex-end; margin-top: 14px; }
#toast { position: fixed; left: 50%; bottom: calc(var(--bottom) + 16px); z-index: 90; transform: translate(-50%, 20px); max-width: calc(100% - 32px); padding: 12px 16px; border-radius: 14px; background: #2b3242; color: var(--text); font-weight: 600; font-size: 14px; box-shadow: var(--shadow); opacity: 0; pointer-events: none; transition: opacity .2s, transform .2s; }
#toast.show { opacity: 1; transform: translate(-50%, 0); }

/* SVG diagrams */
.chord-svg { width: 100%; height: auto; display: block; }
.cd-name { font: 800 17px system-ui, sans-serif; fill: var(--text); }
.cd-nut { stroke: var(--text); stroke-width: 5; }
.cd-fret { stroke: #5b6478; stroke-width: 1.5; }
.cd-string { stroke: #8b94a8; stroke-width: 1.3; }
.cd-fr { font: 700 11px system-ui, sans-serif; fill: var(--muted); }
.cd-x { font: 700 15px system-ui, sans-serif; fill: var(--muted); }
.cd-open { fill: none; stroke: var(--text); stroke-width: 1.6; }
.cd-finger { font: 800 11px system-ui, sans-serif; fill: #12131a; }
.cd-sname { font: 600 9.5px system-ui, sans-serif; fill: var(--muted); }
.kb-svg { width: 100%; height: auto; display: block; }
.kb-white { fill: #f3f4f7; stroke: #0d0f15; stroke-width: 1; }
.kb-black { fill: #20242e; stroke: #0d0f15; stroke-width: 1; }
.kb-label { font: 800 10px system-ui, sans-serif; fill: #12131a; }
.kb-label-b { fill: #fff; font-size: 8.5px; }
.kb-c { font: 600 8.5px system-ui, sans-serif; fill: #8a90a0; }
.fb-svg { width: 100%; height: auto; display: block; }
.fb-inlay { fill: #2c3343; }
.fb-nut { stroke: var(--text); stroke-width: 4; }
.fb-fret { stroke: #4b5366; stroke-width: 1.5; }
.fb-num { font: 600 10px system-ui, sans-serif; fill: var(--muted); }
.fb-string { stroke: #8b94a8; }
.fb-sname { font: 700 11px system-ui, sans-serif; fill: var(--muted); }
.fb-label { font: 800 9.5px system-ui, sans-serif; fill: #fff; }
.staff-svg { width: 100%; height: auto; max-height: 140px; display: block; }
.st-line { stroke: #8b94a8; stroke-width: 1.2; }
.st-clef { font: 46px serif; fill: var(--text); }
.st-acc { font: 16px serif; fill: var(--text); }
.st-head { fill: var(--text); }
.st-head.hl { fill: var(--accent); }
.st-lbl { font: 700 11px system-ui, sans-serif; fill: var(--muted); }
.tab-svg { width: 100%; height: auto; display: block; max-height: 130px; }
.tb-line { stroke: #6b7488; stroke-width: 1; }
.tb-s { font: 700 10px system-ui, sans-serif; fill: var(--muted); }
.tb-bg { fill: var(--bg2); }
.tb-bg.hl { fill: var(--accent); }
.tb-f { font: 800 12px system-ui, sans-serif; fill: var(--text); }

@media (min-width: 720px) {
  #view { padding-top: 26px; }
  .hw-canvas { height: 280px; }
  .hw-canvas.sing { height: 320px; }
  .tool-grid { grid-template-columns: repeat(3, 1fr); }
}
@media (max-width: 380px) {
  .inst b { font-size: 11.5px; }
  .tc-name { font-size: 38px; }
  .stat-grid { grid-template-columns: repeat(2, 1fr); }
}
@media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }

/* ---------- strumming & picking diagrams ---------- */
.strum-fig { display: block; width: 100%; margin: 10px 0; padding: 12px 10px 8px; border-radius: var(--r); background: var(--card); border: 1px solid var(--line); color: inherit; font: inherit; cursor: pointer; text-align: center; }
.strum-fig:active { background: var(--card2); }
.strum-row { display: flex; justify-content: center; align-items: stretch; gap: 2px; flex-wrap: nowrap; overflow-x: auto; }
.strum-cell { flex: 1 1 0; min-width: 17px; max-width: 46px; display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 4px 0; border-radius: 8px; }
.strum-cell.beat { background: var(--card2); }
.sc-arrow { font-size: 24px; font-weight: 900; line-height: 1; color: var(--accent); }
.strum-cell.ghost .sc-arrow { opacity: .22; color: var(--muted); }
.strum-cell.mute .sc-arrow { color: var(--bad); font-size: 20px; line-height: 24px; }
.strum-cell.bass .sc-arrow { color: var(--ok); font-size: 18px; line-height: 24px; }
.sc-count { font-size: 12px; font-weight: 700; color: var(--muted); }
.strum-cell.beat .sc-count { color: var(--text); }
.strum-bar { flex: none; width: 2px; background: var(--line); margin: 0 3px; border-radius: 1px; }
.strum-cap { display: flex; align-items: center; justify-content: center; gap: 6px; margin-top: 8px; font-size: 12px; color: var(--muted); }
.pick-svg { width: 100%; max-width: 420px; height: auto; display: block; margin: 0 auto; }
.pd-line { stroke: var(--line); stroke-width: 1.4; }
.pd-bar { stroke: var(--line); stroke-width: 1; opacity: .5; }
.pd-bar.strong { opacity: 1; stroke-width: 1.6; }
.pd-str, .pd-count { fill: var(--muted); font: 700 11px system-ui, sans-serif; }
.pd-dot { fill: var(--accent); }
.pd-dot.f-p { fill: #34d399; } .pd-dot.f-i { fill: #60a5fa; } .pd-dot.f-m { fill: #fbbf24; } .pd-dot.f-a { fill: #fb7185; }
.pd-f { fill: #12131a; font: 800 11px system-ui, sans-serif; text-anchor: middle; }
.pick-keys { display: flex; flex-wrap: wrap; gap: 6px; justify-content: center; }
.pick-keys span { padding: 6px 10px; border-radius: 9px; background: var(--card2); font-weight: 800; }

/* ---------- skill paths ---------- */
.learn-seg { margin-top: 14px; }
.path-card { display: flex; align-items: flex-start; gap: 12px; padding: 14px; margin-bottom: 10px; border-radius: var(--r); background: var(--card); border: 1px solid var(--line); }
.path-card:active { background: var(--card2); }
.path-ic { flex: none; width: 46px; height: 46px; border-radius: 14px; display: flex; align-items: center; justify-content: center; background: var(--accent-soft); color: var(--accent); }
.path-ic.big { width: 58px; height: 58px; border-radius: 18px; }
.path-main { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 6px; }
.path-main b { font-size: 16.5px; }
.path-next { color: var(--accent); font-weight: 700; }
.path-head { display: flex; gap: 14px; align-items: center; }
.path-bar { margin: 4px 0 14px; }
.lv-row { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; }
.lv { font-size: 10.5px; font-weight: 800; padding: 3px 8px; border-radius: 999px; background: var(--card2); color: var(--muted); }
.lv.lv-b { background: #34d39922; color: #34d399; } .lv.lv-i { background: #fbbf2422; color: #fbbf24; } .lv.lv-p { background: #fb718522; color: #fb7185; }
.level-title { margin: 16px 2px 8px; font-size: 12.5px; text-transform: uppercase; letter-spacing: .08em; }
.level-title:first-child { margin-top: 4px; }
.level-title.lv-b { color: #34d399; } .level-title.lv-i { color: #fbbf24; } .level-title.lv-p { color: #fb7185; }
.chapters .level-title + .chapter { margin-top: 0; }

/* ---------- today card, practice time, badges ---------- */
.card.today { padding: 0; margin: 14px 0 0; overflow: hidden; }
.today-head { width: 100%; display: flex; align-items: center; gap: 12px; padding: 12px 14px; background: none; border: 0; color: inherit; font: inherit; text-align: left; cursor: pointer; }
.today-rows { display: none; padding: 0 8px 8px; }
.today.open .today-rows { display: block; }
.today.open .today-head > .ic { transform: rotate(180deg); }
.today-row { display: flex; align-items: center; gap: 12px; padding: 10px 8px; border-radius: 12px; }
.today-row:active { background: var(--card2); }
.tr-main { flex: 1; min-width: 0; display: flex; flex-direction: column; }
.tr-main small { font-size: 11.5px; color: var(--muted); }
.today-row .tr-main small { text-transform: uppercase; letter-spacing: .05em; font-weight: 700; color: var(--accent); font-size: 10.5px; }
.tr-check { flex: none; width: 24px; height: 24px; border-radius: 50%; border: 2px solid var(--line); display: flex; align-items: center; justify-content: center; }
.today-row.done .tr-check { background: var(--ok); border-color: var(--ok); color: #0b1410; }
.today-row.done b { color: var(--muted); text-decoration: line-through; }
.goal-ring { flex: none; display: inline-flex; }
.goal-ring .ring-bg { fill: none; stroke: var(--line); stroke-width: 3.5; }
.goal-ring .ring-fg { fill: none; stroke: var(--accent); stroke-width: 3.5; stroke-linecap: round; }
.goal-ring.full .ring-fg { stroke: var(--ok); }
.ring-txt { fill: var(--text); font: 800 11px system-ui, sans-serif; }
.week { display: flex; gap: 8px; align-items: flex-end; height: 120px; margin: 10px 0; }
.wk-col { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 4px; height: 100%; font-size: 11px; }
.wk-col small:first-child { height: 14px; }
.wk-bar { flex: 1; width: 100%; max-width: 30px; border-radius: 8px; background: var(--card2); display: flex; align-items: flex-end; overflow: hidden; }
.wk-bar i { display: block; width: 100%; background: var(--accent); border-radius: 8px; }
.wk-bar i.full { background: var(--ok); }
.wk-col.today small:last-child { color: var(--accent); font-weight: 800; }
.badge-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin-top: 8px; }
.bdg { display: flex; flex-direction: column; align-items: center; gap: 5px; padding: 10px 4px; border-radius: 14px; background: var(--card2); border: 1px solid transparent; color: var(--muted); font: inherit; opacity: .45; cursor: pointer; }
.bdg small { font-size: 10.5px; line-height: 1.2; text-align: center; font-weight: 700; }
.bdg.got { opacity: 1; color: var(--text); border-color: var(--accent-mid); }
.bdg.got .ic { color: var(--accent); }
.badge-pop { display: flex; flex-wrap: wrap; gap: 6px; justify-content: center; margin-top: 14px; }

/* ---------- trainers ---------- */
.section-title { margin: 18px 2px 10px; }
.opt-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; }
.opt-grid .btn { border-radius: 14px; min-height: 50px; padding: 0 8px; }
.btn.right { border-color: var(--ok); background: #34d39922; color: var(--ok); }
.btn.wrong { border-color: var(--bad); background: #f8717122; color: var(--bad); }
.ear-fb { text-align: center; font-weight: 700; margin-top: 12px; min-height: 44px; }
.ear-fb.ok { color: var(--ok); } .ear-fb.bad { color: var(--bad); }
.btn.round.big { width: 84px; height: 84px; }
.chg-count { font-size: 34px; font-weight: 900; line-height: 1.1; margin-top: 8px; }
.finder-where { font-weight: 700; margin: 2px 0 0; min-height: 22px; }
.fig.wide.scroll { overflow-x: auto; }
.fig.wide.scroll svg { width: auto; min-width: 640px; max-height: none; height: 170px; }
.pick.key-chord { display: inline-flex; flex-direction: column; align-items: center; gap: 1px; padding: 5px 10px; min-height: 46px; }
.pick.key-chord small { font-size: 10px; color: var(--muted); font-weight: 700; }
.recorder { display: flex; flex-direction: column; align-items: center; gap: 12px; padding: 10px 0 4px; }
.recorder .bar { width: 100%; }
.rec-btn { background: var(--bad); color: #fff; }

<noscript><p style="padding:20px">Tonic needs JavaScript to run.</p></noscript>
<script>
(function () {
'use strict';
/* ---- dsp.js ---- */
/* ==========================================================================
   DSP core: note math, FFT, YIN pitch, chroma + chord matching, onsets.
   Pure functions on Float32Arrays so they run in the browser and in Node tests.
   ========================================================================== */

const SHARPS = ['C','C#','D','D#','E','F','F#','G','G#','A','A#','B'];
const FLATS  = ['C','Db','D','Eb','E','F','Gb','G','Ab','A','Bb','B'];
const SOLFEGE = ['Do','Di','Re','Ri','Mi','Fa','Fi','Sol','Si','La','Li','Ti'];

const mod12 = n => ((n % 12) + 12) % 12;
const midiToFreq = m => 440 * Math.pow(2, (m - 69) / 12);
const freqToMidi = f => 69 + 12 * Math.log2(f / 440);
const pcName = (pc, flats) => (flats ? FLATS : SHARPS)[mod12(pc)];
function noteName(m, flats, withOctave = true) {
  const r = Math.round(m);
  return pcName(r, flats) + (withOctave ? (Math.floor(r / 12) - 1) : '');
}
function parsePc(s) {
  const m = /^([A-Ga-g])([#b♯♭]?)/.exec(String(s).trim());
  if (!m) return null;
  const base = { C: 0, D: 2, E: 4, F: 5, G: 7, A: 9, B: 11 }[m[1].toUpperCase()];
  const acc = (m[2] === '#' || m[2] === '♯') ? 1 : (m[2] === 'b' || m[2] === '♭') ? -1 : 0;
  return mod12(base + acc);
}
/** "C#4" | "Bb3" | "E2" -> midi number */
function parseNote(s) {
  if (typeof s === 'number') return s;
  const m = /^([A-Ga-g])([#b]?)(-?\d)$/.exec(String(s).trim());
  if (!m) return null;
  const base = { C: 0, D: 2, E: 4, F: 5, G: 7, A: 9, B: 11 }[m[1].toUpperCase()];
  const acc = m[2] === '#' ? 1 : m[2] === 'b' ? -1 : 0;
  return (parseInt(m[3], 10) + 1) * 12 + base + acc;

/* ---------------- Chords ---------------- */
const CHORD_TYPES = {
  '':     [0, 4, 7],
  'm':    [0, 3, 7],
  '7':    [0, 4, 7, 10],
  'maj7': [0, 4, 7, 11],
  'm7':   [0, 3, 7, 10],
  'sus2': [0, 2, 7],
  'sus4': [0, 5, 7],
  'dim':  [0, 3, 6],
  'aug':  [0, 4, 8],
  '5':    [0, 7],
  '6':    [0, 4, 7, 9],
  'm6':   [0, 3, 7, 9],
  'add9': [0, 2, 4, 7],
  '9':    [0, 2, 4, 7, 10],
  'maj9': [0, 2, 4, 7, 11],
  'm9':   [0, 2, 3, 7, 10],
  'dim7': [0, 3, 6, 9],
  'm7b5': [0, 3, 6, 10],
  '7sus4':[0, 5, 7, 10],
  '13':   [0, 4, 7, 9, 10],

const TYPE_ALIASES = {
  '': '', 'M': '', 'maj': '', 'major': '',
  'm': 'm', 'min': 'm', '-': 'm', 'minor': 'm',
  '7': '7', 'dom7': '7',
  'maj7': 'maj7', 'M7': 'maj7', 'Δ': 'maj7', 'Δ7': 'maj7',
  'm7': 'm7', 'min7': 'm7', '-7': 'm7',
  'sus2': 'sus2', 'sus4': 'sus4', 'sus': 'sus4',
  'dim': 'dim', '°': 'dim', 'aug': 'aug', '+': 'aug',
  '5': '5', '6': '6', 'm6': 'm6', 'add9': 'add9', '9': '9', 'maj9': 'maj9', 'm9': 'm9',
  'dim7': 'dim7', '°7': 'dim7', 'm7b5': 'm7b5', 'ø': 'm7b5', 'ø7': 'm7b5',
  '7sus4': '7sus4', '7sus': '7sus4', '13': '13',
};
const TYPE_LABEL = { '': 'major', 'm': 'minor', '7': 'dominant 7th', 'maj7': 'major 7th', 'm7': 'minor 7th',
  'sus2': 'suspended 2nd', 'sus4': 'suspended 4th', 'dim': 'diminished', 'aug': 'augmented', '5': 'power chord',
  '6': 'major 6th', 'm6': 'minor 6th', 'add9': 'add 9', '9': 'dominant 9th', 'maj9': 'major 9th', 'm9': 'minor 9th',
  'dim7': 'diminished 7th', 'm7b5': 'half-diminished', '7sus4': '7 sus 4', '13': '13th' };

function parseChord(name) {
  const m = /^([A-G])([#b]?)([^/]*)(?:\/([A-G][#b]?))?$/.exec(String(name).trim());
  if (!m) return null;
  const root = parsePc(m[1] + m[2]);
  const type = TYPE_ALIASES[m[3]];
  if (type === undefined) return null;
  const bass = m[4] ? parsePc(m[4]) : null;
  return { root, type, bass, flats: m[2] === 'b', rootName: m[1] + m[2], bassName: m[4] || null };
}
function chordPcs(name) {
  const c = typeof name === 'string' ? parseChord(name) : name;
  if (!c) return [];
  const pcs = CHORD_TYPES[c.type].map(i => mod12(c.root + i));
  if (c.bass !== null && !pcs.includes(c.bass)) pcs.push(c.bass);
  return pcs;
}
function chordDisplay(name) { return String(name).replace('b', '♭').replace('#', '♯'); }

/** Transpose a chord or note name by n semitones. */
function transposeChord(name, semis, preferFlats) {
  const c = parseChord(name);
  if (!c) return name;
  const fl = preferFlats === undefined ? c.flats : preferFlats;
  let out = pcName(c.root + semis, fl) + rawTypeOf(name);
  if (c.bass !== null) out += '/' + pcName(c.bass + semis, fl);
  return out;
}
function rawTypeOf(name) {
  const m = /^([A-G])([#b]?)([^/]*)/.exec(name);
  return m ? m[3] : '';

/* ---------------- FFT (iterative radix-2) ---------------- */
class FFT {
  constructor(n) {
    this.n = n;
    const levels = Math.round(Math.log2(n));
    this.cos = new Float64Array(n / 2);
    this.sin = new Float64Array(n / 2);
    for (let i = 0; i < n / 2; i++) {
      this.cos[i] = Math.cos(2 * Math.PI * i / n);
      this.sin[i] = Math.sin(2 * Math.PI * i / n);
    }
    this.rev = new Uint32Array(n);
    for (let i = 0; i < n; i++) {
      let r = 0, x = i;
      for (let j = 0; j < levels; j++) { r = (r << 1) | (x & 1); x >>= 1; }
      this.rev[i] = r;
    }
  }
  transform(re, im) {
    const n = this.n, rev = this.rev, cs = this.cos, sn = this.sin;
    for (let i = 0; i < n; i++) {
      const j = rev[i];
      if (j > i) {
        let t = re[i]; re[i] = re[j]; re[j] = t;
        t = im[i]; im[i] = im[j]; im[j] = t;
      }
    }
    for (let size = 2; size <= n; size <<= 1) {
      const half = size >> 1, step = n / size;
      for (let i = 0; i < n; i += size) {
        for (let j = i, k = 0; j < i + half; j++, k += step) {
          const l = j + half;
          const tre = re[l] * cs[k] + im[l] * sn[k];
          const tim = im[l] * cs[k] - re[l] * sn[k];
          re[l] = re[j] - tre; im[l] = im[j] - tim;
          re[j] += tre; im[j] += tim;
        }
      }
    }
  }
}

/* ---------------- YIN pitch detector ---------------- */
class PitchDetector {
  constructor(sampleRate, size = 2048, minFreq = 60, maxFreq = 2100) {
    this.sr = sampleRate;
    this.size = size;
    this.tauMax = Math.min(Math.floor(sampleRate / minFreq), Math.floor(size / 2));
    this.tauMin = Math.max(2, Math.floor(sampleRate / maxFreq));
    this.d = new Float32Array(this.tauMax + 2);
    this.threshold = 0.15;
  }
  /** Uses the last `size` samples of buf. Returns {freq, midi, clarity} or null. */
  detect(buf) {
    const n = this.size, off = buf.length - n, tauMax = this.tauMax, W = n - tauMax, d = this.d;
    if (off < 0) return null;
    // Difference function via FFT cross-correlation (≈10× faster than the direct sum):
    // d(τ) = Σx[j]² + Σx[j+τ]² − 2·Σx[j]x[j+τ],  j = 0..W−1
    if (!this.fft) {
      let M = 1; while (M < n + W) M <<= 1;
      this.M = M; this.fft = new FFT(M);
      this.ar = new Float64Array(M); this.ai = new Float64Array(M);
      this.br = new Float64Array(M); this.bi = new Float64Array(M);
      this.cum = new Float64Array(n + 1);
    }
    const M = this.M, ar = this.ar, ai = this.ai, br = this.br, bi = this.bi, cum = this.cum;
    ar.fill(0); ai.fill(0); br.fill(0); bi.fill(0);
    for (let j = 0; j < W; j++) ar[j] = buf[off + j];
    for (let j = 0; j < n; j++) br[j] = buf[off + j];
    cum[0] = 0;
    for (let j = 0; j < n; j++) cum[j + 1] = cum[j] + buf[off + j] * buf[off + j];
    this.fft.transform(ar, ai);
    this.fft.transform(br, bi);
    // conj(A)·B, then inverse FFT via the conjugate trick
    for (let k = 0; k < M; k++) {
      const re = ar[k] * br[k] + ai[k] * bi[k];
      const im = ar[k] * bi[k] - ai[k] * br[k];
      ar[k] = re; ai[k] = -im;
    }
    this.fft.transform(ar, ai);
    const e0 = cum[W];
    for (let tau = 1; tau <= tauMax; tau++) {
      const c = ar[tau] / M;
      const v = e0 + (cum[tau + W] - cum[tau]) - 2 * c;
      d[tau] = v > 0 ? v : 0;
    }
    d[0] = 1;
    let run = 0;
    for (let tau = 1; tau <= tauMax; tau++) {
      run += d[tau];
      d[tau] = run > 0 ? d[tau] * tau / run : 1;
    }
    let tau = -1;
    for (let t = this.tauMin; t <= tauMax; t++) {
      if (d[t] < this.threshold) {
        while (t + 1 <= tauMax && d[t + 1] < d[t]) t++;
        tau = t;
        break;
      }
    }
    if (tau < 0) {
      let best = Infinity;
      for (let t = this.tauMin; t <= tauMax; t++) if (d[t] < best) { best = d[t]; tau = t; }
      if (best > 0.45) return null;
    }
    let better = tau;
    if (tau > 1 && tau < tauMax) {
      const s0 = d[tau - 1], s1 = d[tau], s2 = d[tau + 1];
      const den = s0 + s2 - 2 * s1;
      if (Math.abs(den) > 1e-9) better = tau + (s0 - s2) / (2 * den);
    }
    const freq = this.sr / better;
    return { freq, midi: freqToMidi(freq), clarity: 1 - d[tau] };
  }
}

/* ---------------- Chroma (pitch-class profile) ---------------- */
class ChromaAnalyzer {
  constructor(sampleRate, size = 8192, fMin = 75, fMax = 2100) {
    this.sr = sampleRate;
    this.n = size;
    this.fft = new FFT(size);
    this.re = new Float64Array(size);
    this.im = new Float64Array(size);
    this.win = new Float64Array(size);
    for (let i = 0; i < size; i++) this.win[i] = 0.5 - 0.5 * Math.cos(2 * Math.PI * i / (size - 1));
    this.mag = new Float64Array(size / 2 + 1);
    this.kMin = Math.max(2, Math.floor(fMin * size / sampleRate));
    this.kMax = Math.min(size / 2 - 2, Math.ceil(fMax * size / sampleRate));
    this.chroma = new Float64Array(12);
    this.tuning = 0;       // global tuning offset (semitones), slowly adapted
    this.peakCount = 0;
    this.adaptTuning = true;
  }
  compute(buf) {
    const n = this.n, off = buf.length - n, re = this.re, im = this.im, w = this.win;
    const ch = this.chroma;
    ch.fill(0);
    if (off < 0) return ch;
    for (let i = 0; i < n; i++) { re[i] = buf[off + i] * w[i]; im[i] = 0; }
    this.fft.transform(re, im);
    const mag = this.mag;
    let maxMag = 0;
    for (let k = this.kMin - 1; k <= this.kMax + 1; k++) {
      const m = Math.sqrt(re[k] * re[k] + im[k] * im[k]);
      mag[k] = m;
      if (m > maxMag) maxMag = m;
    }
    this.peakCount = 0;
    this.maxMag = maxMag;
    if (maxMag <= 1e-9) return ch;
    const thr = maxMag * 0.035;
    let tSum = 0, tW = 0;
    for (let k = this.kMin; k <= this.kMax; k++) {
      const b = mag[k];
      if (b < thr || b <= mag[k - 1] || b < mag[k + 1]) continue;
      const a = Math.log(mag[k - 1] + 1e-12), bl = Math.log(b), c = Math.log(mag[k + 1] + 1e-12);
      const den = a - 2 * bl + c;
      let p = den !== 0 ? 0.5 * (a - c) / den : 0;
      if (p > 0.5) p = 0.5; else if (p < -0.5) p = -0.5;
      const f = (k + p) * this.sr / n;
      const midi = 69 + 12 * Math.log2(f / 440);
      const mm = midi - this.tuning;
      const r = Math.round(mm), dev = mm - r;
      let wgt = Math.sqrt(b / maxMag) * Math.exp(-(dev * dev) / (2 * 0.2 * 0.2));
      if (f > 900) wgt *= 900 / f;
      ch[((r % 12) + 12) % 12] += wgt;
      this.peakCount++;
      const rawDev = midi - Math.round(midi);
      if (Math.abs(rawDev) < 0.4) { tSum += rawDev * b; tW += b; }
    }
    if (this.adaptTuning && this.peakCount >= 3 && tW > 0) {
      const est = tSum / tW;
      this.tuning += 0.03 * (est - this.tuning);
      if (this.tuning > 0.35) this.tuning = 0.35; else if (this.tuning < -0.35) this.tuning = -0.35;
    }

    for (let i = 0; i < 12; i++) norm += ch[i] * ch[i];
    norm = Math.sqrt(norm);
    if (norm > 0) for (let i = 0; i < 12; i++) ch[i] /= norm;
    return ch;
  }
  /** Interpolated frequency of the local peak at bin k (parabolic fit on log magnitude). */
  peakFreq(k) {
    const mag = this.mag;
    const a = Math.log(mag[k - 1] + 1e-12), b = Math.log(mag[k] + 1e-12), c = Math.log(mag[k + 1] + 1e-12);
    const den = a - 2 * b + c;
    let p = den !== 0 ? 0.5 * (a - c) / den : 0;
    if (p > 0.5) p = 0.5; else if (p < -0.5) p = -0.5;
    return (k + p) * this.sr / this.n;
  }
  /** Magnitude (relative to the loudest peak) of a spectral peak within ±cents of freq, else 0. */
  peakNear(freq, cents = 35) {
    const n = this.n, sr = this.sr, mag = this.mag;
    const lo = Math.max(this.kMin, Math.floor(freq * Math.pow(2, -cents / 1200) * n / sr) - 1);
    const hi = Math.min(this.kMax, Math.ceil(freq * Math.pow(2, cents / 1200) * n / sr) + 1);
    let best = 0;
    for (let k = lo; k <= hi; k++) {
      const b = mag[k];
      if (b <= best || b <= mag[k - 1] || b < mag[k + 1]) continue;
      if (Math.abs(1200 * Math.log2(this.peakFreq(k) / freq)) <= cents) best = b;
    }
    return this.maxMag > 0 ? best / this.maxMag : 0;
  }
  /**
   * Check a known voicing (exact notes, e.g. a guitar chord shape) against the
   * last computed spectrum. Notes whose overtones coincide with another note are
   * skipped (they cannot be told apart); the rest must be present, and no loud
   * peak may be left unexplained by the expected notes.
   */
  voicing(midis, strict = 1, essentialPcs = null) {
    const tune = this.tuning;
    const fr = midis.map(m => 440 * Math.pow(2, (m + tune - 69) / 12));
    const near = (a, b, c = 40) => Math.abs(1200 * Math.log2(a / b)) < c;
    const minPresence = [0.008, 0.014, 0.025][strict];
    const missing = [];
    let checked = 0;
    for (let i = 0; i < fr.length; i++) {
      let target = 0;
      for (let h = 1; h <= 4 && !target; h++) {
        const fh = fr[i] * h;
        if (fh < 95 || fh > 2000) continue;
        let clash = false;
        for (let j = 0; j < fr.length && !clash; j++) {
          if (j === i || near(fr[j], fr[i], 10)) continue; // unison doublings don't hide each other
          for (let k = 1; k <= 6; k++) if (near(fh, fr[j] * k)) { clash = true; break; }
        }
        if (!clash) target = fh;
      }
      if (!target) continue;
      checked++;
      if (this.peakNear(target) < minPresence) missing.push(midis[i]);
    }
    // a missing note is forgivable if its pitch class still sounds elsewhere and is not essential
    const allowMissing = [2, 1, 0][strict];
    let fatal = false;
    for (const m of missing) {
      const pc = mod12(m);
      const elsewhere = midis.some(o => o !== m && mod12(o) === pc && !missing.includes(o));
      if (!elsewhere && (!essentialPcs || essentialPcs.includes(pc))) fatal = true;
    }
    if (missing.length > allowMissing) fatal = true;
    // loud peaks below ~800 Hz that no expected note explains = a wrong note
    let foreign = 0;
    {
      const lim = [0.35, 0.25, 0.15][strict];
      const n = this.n, sr = this.sr, mag = this.mag;
      const kTop = Math.min(this.kMax, Math.floor(800 * n / sr));
      for (let k = this.kMin; k <= kTop; k++) {
        const b = mag[k];
        if (b < lim * this.maxMag || b <= mag[k - 1] || b < mag[k + 1]) continue;
        const f = this.peakFreq(k);
        let explained = false;
        for (let i = 0; i < fr.length && !explained; i++) for (let h = 1; h <= 10; h++) if (near(f, fr[i] * h, 60)) { explained = true; break; }
        if (!explained) foreign++;

  if (Settings.get('solfege')) return SOLFEGE[mod12(Math.round(midi))].replace('Di', 'Do♯').replace('Ri', 'Re♯').replace('Fi', 'Fa♯').replace('Si', 'Sol♯').replace('Li', 'La♯') + (withOct ? '' : '');

}
function chordLabel(name) { return name ? String(name).replace(/#/g, '♯').replace(/^([A-G])b/, '$1♭').replace(/\/([A-G])b/, '/$1♭') : '—'; }

/* append() turns null into the text "null"; ignore empty children everywhere instead. */
(function () {
  if (typeof Element === 'undefined') return;
  const orig = Element.prototype.append;
  Element.prototype.append = function (...kids) { return orig.apply(this, kids.filter(k => k !== null && k !== undefined && k !== false)); };

/* ---- audio.js ---- */
/* ==========================================================================
   Audio: microphone engine (live analysis) + synth (playback) + scheduler.
   ========================================================================== */

const Engine = (() => {
  const E = {
    ctx: null, master: null,
    state: 'off',            // off | starting | on | blocked | unsupported | error
    errorText: '',
    stream: null, source: null, analyser: null, inGain: null,
    buf: null, sr: 48000,
    pd: null, ca: null, matcher: null, od: new OnsetDetector(),
    listeners: new Set(),
    chordWanted: 0,          // >0 while some screen needs chord analysis
    sensitivity: 1,
    latency: 0.09,           // seconds from "scheduled beat" to "detected in mic"
    mutedUntil: 0,
    noise: 0.002, noiseHF: 0.004,
    pitchHist: [],
    frame: null,
    raf: 0, frameNo: 0,
    lastChromaT: 0,
    chromaReady: false,
    tickCount: 0,
  };

  function ensure() {
    if (!E.ctx) {
      const AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) return null;
      try { E.ctx = new AC({ latencyHint: 'interactive' }); } catch (e) { E.ctx = new AC(); }
      E.sr = E.ctx.sampleRate;
      const comp = E.ctx.createDynamicsCompressor();
      comp.threshold.value = -10; comp.ratio.value = 4; comp.attack.value = 0.003; comp.release.value = 0.2;
      E.master = E.ctx.createGain();
      E.master.gain.value = 0.9;
      E.master.connect(comp); comp.connect(E.ctx.destination);
      try { if (navigator.audioSession) navigator.audioSession.type = 'play-and-record'; } catch (e) { /* optional API */ }
    }
    if (E.ctx.state === 'suspended') E.ctx.resume().catch(() => {});
    return E.ctx;
  }

  function micBlockedByFrame() {
    try {
      const pol = document.permissionsPolicy || document.featurePolicy;
      if (pol && typeof pol.allowsFeature === 'function') return !pol.allowsFeature('microphone');
    } catch (e) { /* ignore */ }
    return false;
  }

  async function startMic() {
    if (E.state === 'on') return true;
    if (E.state === 'starting') return false;
    ensure();
    if (!E.ctx) { setState('unsupported', 'This browser has no Web Audio support.'); return false; }
    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia || !window.isSecureContext) {
      setState('blocked', !window.isSecureContext
        ? 'The microphone only works when the app is opened from an https:// address.'
        : 'This browser does not allow microphone access here.');
      return false;
    }
    if (micBlockedByFrame()) {
      setState('blocked', 'This page is shown inside a viewer that blocks the microphone. Open your own copy of the app (see Setup).');
      return false;
    }
    setState('starting');
    try {
      const stream = await navigator.mediaDevices.getUserMedia({
        audio: { echoCancellation: false, noiseSuppression: false, autoGainControl: false, channelCount: 1 },
        video: false,
      });
      E.stream = stream;
      const ctx = E.ctx;
      if (ctx.state === 'suspended') await ctx.resume().catch(() => {});
      E.source = ctx.createMediaStreamSource(stream);
      E.inGain = ctx.createGain();
      E.inGain.gain.value = E.sensitivity;
      const hp = ctx.createBiquadFilter(); hp.type = 'highpass'; hp.frequency.value = 65; hp.Q.value = 0.7;
      const lp1 = ctx.createBiquadFilter(); lp1.type = 'lowpass'; lp1.frequency.value = 2400; lp1.Q.value = 0.6;
      const lp2 = ctx.createBiquadFilter(); lp2.type = 'lowpass'; lp2.frequency.value = 2400; lp2.Q.value = 0.6;
      E.analyser = ctx.createAnalyser();
      E.analyser.fftSize = 16384;
      E.analyser.smoothingTimeConstant = 0;
      const sink = ctx.createGain(); sink.gain.value = 0;
      E.source.connect(E.inGain); E.inGain.connect(hp); hp.connect(lp1); lp1.connect(lp2); lp2.connect(E.analyser);
      E.analyser.connect(sink); sink.connect(ctx.destination);
      E.buf = new Float32Array(E.analyser.fftSize);
      E.pd = new PitchDetector(E.sr, 2048, 60, 2100);
      E.ca = new ChromaAnalyzer(E.sr, 16384);
      E.matcher = E.matcher || new ChordMatcher();
      stream.getAudioTracks().forEach(t => t.addEventListener('ended', () => { stopMic(); setState('error', 'The microphone was disconnected.'); }));
      setState('on');
      Store.set('micWanted', true);
      loop();

    } catch (err) {
      const name = err && err.name;
      if (name === 'NotAllowedError' || name === 'SecurityError') {
